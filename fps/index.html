<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>보급기지 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen first-person view; HUD on the edges: score+timer top center, radar top-left,
   killfeed top-right, health bottom-left, ammo bottom-right, touch controls over the lower half. Single military look. */
:root {
  --ink: #eef0ea;
  --muted: #a9aea4;
  --hud: rgba(14, 16, 14, .6);
  --hud-solid: #141713;
  --line: rgba(238, 240, 234, .18);
  --blue: #5b95f0;
  --red: #ef5a4f;
  --amber: #f2b13a;
  --ok: #9ad46f;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #22261f; color: var(--ink); }
body { font: 14px/1.45 var(--font-body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.42) 100%); }
.hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }

.cross { position: fixed; left: 50%; top: 50%; width: 0; height: 0; }
.cross i { position: absolute; background: var(--ok); box-shadow: 0 0 0 1px rgba(0,0,0,.55); }
.cross .t, .cross .b { width: 2px; height: 8px; left: -1px; }
.cross .l, .cross .r { height: 2px; width: 8px; top: -1px; }
.cross .dot { width: 2px; height: 2px; left: -1px; top: -1px; }
.reddot { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #ff2a2a; box-shadow: 0 0 6px 2px rgba(255, 40, 40, .7), 0 0 0 1px rgba(0,0,0,.4); }
.hitm { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; }
.hitm::before, .hitm::after { content: ""; position: absolute; left: 10px; top: -3px; width: 2px; height: 28px; background: #fff; transform: rotate(45deg); }
.hitm::after { transform: rotate(-45deg); }
.hitm.kill::before, .hitm.kill::after { background: var(--red); }
.dmgdir { position: fixed; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border-top: 6px solid rgba(239, 90, 79, .85); opacity: 0; }
.scope { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0 34vmin, rgba(0,0,0,.35) 34.2vmin, #000 35vmin); }
.scope::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.9); }
.scope::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(0,0,0,.9); }
.hurt { position: fixed; inset: 0; box-shadow: inset 0 0 140px 40px rgba(190, 20, 20, .55); opacity: 0; }

.score { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; align-items: stretch; border-radius: 8px; overflow: hidden; background: var(--hud); }
.score div { padding: 4px 14px; font: 700 22px/1.2 var(--font-num); }
.score .sb { background: rgba(91, 149, 240, .32); }
.score .sr { background: rgba(239, 90, 79, .32); }
.score .st { font-size: 15px; display: grid; place-items: center; min-width: 64px; color: var(--muted); }
.radar { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); width: 124px; height: 124px; border-radius: 50%; background: rgba(14, 16, 14, .55); border: 1px solid var(--line); }
.feed { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 3px; max-width: 46vw; }
.feed div { padding: 2px 8px; border-radius: 5px; background: var(--hud); font-size: 12.5px; white-space: nowrap; }
.feed .b { color: var(--blue); font-weight: 700; } .feed .r { color: var(--red); font-weight: 700; }
.feed .w { color: var(--muted); padding-inline: 6px; } .feed .hs { color: var(--amber); font-weight: 700; }
.feed .me { outline: 1px solid var(--amber); }
.hp { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 8px; background: var(--hud); display: flex; align-items: center; gap: 10px; }
.hp b { font: 700 30px/1 var(--font-num); min-width: 2.2em; }
.hp .bar { width: 120px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
.hp .bar i { display: block; height: 100%; width: 100%; background: var(--ok); }
.ammo { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 8px; background: var(--hud); text-align: right; }
.ammo b { font: 700 30px/1 var(--font-num); }
.ammo span { font: 500 15px var(--font-num); color: var(--muted); }
.ammo small { display: block; font-size: 12px; color: var(--muted); }
.center-msg { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); text-align: center; text-shadow: 0 2px 6px #000; }
.center-msg b { display: block; font: 700 46px/1 var(--font-num); letter-spacing: .04em; }
.center-msg span { font-size: 15px; }
.pickmsg { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 4px 12px; border-radius: 8px; background: var(--hud); font-weight: 700; font-size: 13px; color: var(--ok); white-space: nowrap; }
.reloadmsg { position: fixed; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-weight: 700; font-size: 13px; color: var(--amber); text-shadow: 0 1px 3px #000; }

.board { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); padding: 12px; border-radius: 12px; background: rgba(14, 16, 14, .9); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.board h3 { margin: 0 0 6px; font: 700 17px var(--font-body); }
.board table { width: 100%; border-collapse: collapse; font-size: 13px; }
.board td { padding: 3px 4px; border-top: 1px solid var(--line); }
.board td:not(:first-child) { text-align: right; font-family: var(--font-num); }
.board .meRow { color: var(--amber); font-weight: 700; }

.touch { position: fixed; inset: 0; pointer-events: none; }
.touch > * { pointer-events: auto; }
.joy { position: fixed; left: 22px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px; border-radius: 50%; background: rgba(14,16,14,.3); border: 2px solid var(--line); touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(238,240,234,.5); }
.tb { position: fixed; border: 2px solid var(--line); border-radius: 50%; background: rgba(14,16,14,.45); font-weight: 700; font-size: 12px; display: grid; place-items: center; touch-action: none; }
.tb.on { background: rgba(242, 177, 58, .7); color: #111; }
.tb.fire { width: 84px; height: 84px; right: 26px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); background: rgba(239, 90, 79, .55); font-size: 15px; }
.tb.fire2 { width: 64px; height: 64px; left: 26px; bottom: calc(220px + env(safe-area-inset-bottom, 0px)); background: rgba(239, 90, 79, .45); }
.tb.aim { width: 56px; height: 56px; right: 122px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.tb.jump { width: 56px; height: 56px; right: 30px; bottom: calc(216px + env(safe-area-inset-bottom, 0px)); }
.tb.crouch { width: 50px; height: 50px; right: 96px; bottom: calc(232px + env(safe-area-inset-bottom, 0px)); }
.tb.reload { width: 50px; height: 50px; right: 44px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
.tb.swap { width: 50px; height: 50px; right: 180px; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
.tb.leanl { width: 50px; height: 40px; left: 170px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); border-radius: 10px; font-size: 11px; }
.tb.leanr { width: 50px; height: 40px; left: 226px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); border-radius: 10px; font-size: 11px; }
.tb.nade { width: 50px; height: 50px; right: 168px; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
.tb.menu { width: 44px; height: 44px; left: 50%; margin-left: -22px; top: calc(52px + env(safe-area-inset-top, 0px)); border-radius: 10px; }
.ptr .hp, .ptr .ammo { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.ptr .ammo { right: 50%; transform: translateX(calc(50% + 90px)); }
.ptr .hp { left: 50%; transform: translateX(calc(-50% - 90px)); }
.ptr .radar { width: 96px; height: 96px; }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(8, 10, 8, .6); }
.card { width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; padding: 20px 18px; border-radius: 14px; background: var(--hud-solid); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; text-align: center; }
.card h1 { margin: 0; font: 700 36px/1.1 var(--font-body); color: var(--amber); letter-spacing: -.01em; text-wrap: balance; }
.card h1 small { display: block; font: 700 13px var(--font-num); color: var(--muted); letter-spacing: .25em; margin-top: 6px; }
.card h2 { margin: 0; font: 700 28px var(--font-body); }
.card p { margin: 0; color: var(--muted); }
.set { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.set .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }
.seg button { height: 38px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--amber); color: #111; border-color: var(--amber); }
.row { display: flex; align-items: center; gap: 10px; }
.row label { flex: none; width: 5.5em; font-weight: 700; font-size: 13px; }
.row input { flex: 1; min-width: 0; accent-color: var(--amber); }
.row output { width: 2.6em; text-align: right; font-family: var(--font-num); }
.keys { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; font-size: 12.5px; }
.keys dt { font-family: var(--font-num); font-weight: 700; white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
details { text-align: left; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
.btn { height: 50px; border: 0; border-radius: 10px; background: var(--amber); color: #111; font: 700 20px var(--font-body); box-shadow: 0 4px 0 #8f5e05; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8f5e05; }
.btn.ghost { background: #2b3029; color: var(--ink); box-shadow: 0 4px 0 #0c0e0c; font-size: 15px; }
.result { font: 700 42px/1 var(--font-num); }
.result .b { color: var(--blue); } .result .r { color: var(--red); }
.err { color: #ffb4a8; }
@media (max-height: 520px) { .card details { display: none; } }
@media (max-height: 720px) {
  .overlay { padding: 8px; }
  .card > p { display: none; }
  .card { gap: 8px; padding-block: 12px; }
  .card h1 { font-size: 24px; } .card h1 small { margin-top: 2px; }
  .set { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; row-gap: 6px; }
  .set .row { grid-column: 1 / -1; }
  .seg button { height: 32px; }
  .btn { height: 44px; }
}
@media (max-width: 480px) { .score div { font-size: 18px; padding: 3px 10px; } .hp .bar { width: 70px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="view" aria-label="게임 화면"></canvas>
<div class="vignette"></div>

<div class="hud" id="hud" hidden>
  <div class="scope" id="scope" hidden></div>
  <div class="hurt" id="hurt"></div>
  <div class="cross" id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div class="reddot" id="reddot" hidden></div>
  <div class="hitm" id="hitm"></div>
  <div class="dmgdir" id="dmgdir"></div>
  <div class="score"><div class="sb" id="sBlue">0</div><div class="st" id="sTime">5:00</div><div class="sr" id="sRed">0</div></div>
  <canvas class="radar" id="radar" width="248" height="248"></canvas>
  <div class="feed" id="feed"></div>
  <div class="hp"><b id="hpNum">100</b><div class="bar"><i id="hpBar"></i></div></div>
  <div class="ammo"><b id="ammoMag">30</b> <span id="ammoRes">/ 120</span><small id="wName">소총 · 수류탄 2</small></div>
  <div class="reloadmsg" id="reloadMsg" hidden>재장전 중</div>
  <div class="pickmsg" id="pickMsg" hidden></div>
  <div class="center-msg" id="centerMsg" hidden><b id="cmBig"></b><span id="cmSmall"></span></div>
  <div class="board" id="board" hidden></div>
</div>

<div class="touch" id="touch" hidden>
  <div class="joy" id="joy"><i id="knob"></i></div>
  <button class="tb fire" id="tFire" type="button">발사</button>
  <button class="tb fire2" id="tFire2" type="button">발사</button>
  <button class="tb aim" id="tAim" type="button">조준</button>
  <button class="tb jump" id="tJump" type="button">점프</button>
  <button class="tb crouch" id="tCrouch" type="button">앉기</button>
  <button class="tb reload" id="tReload" type="button">장전</button>
  <button class="tb swap" id="tSwap" type="button">무기</button>
  <button class="tb nade" id="tNade" type="button">수류탄</button>
  <button class="tb leanl" id="tLeanL" type="button">◀ 기울</button>
  <button class="tb leanr" id="tLeanR" type="button">기울 ▶</button>
  <button class="tb menu" id="tMenu" type="button">II</button>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"><p>불러오는 중…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// =============== map: supply depot with A and B sites and a two-storey middle building ===============
// Blue holds the west (A site north-west, B site south-west); Red attacks from the east by three routes:
// the indoor corridor building (north, to A), the middle building with its second floor, and the long outdoor alley (south, to B).
const MX = 48, MZ = 32;                     // half extents (meters)
const FLOOR2 = 3.2;                         // second-floor height
const BOXES = [];
function addBox(cx, cz, sx, sz, h, mat, y0 = 0, vis = true) {
  BOXES.push({ x0: cx - sx / 2, x1: cx + sx / 2, z0: cz - sz / 2, z1: cz + sz / 2, y0, y1: y0 + h, mat, vis });
}
// A wall with door/window openings. axis 'x': wall at x = c running along z; axis 'z': wall at z = c running along x.
// holes: [{ a, b, y0, y1 }] along the wall length.
function wall(axis, c, a0, a1, h, mat, holes = [], t = .5, base = 0) {
  const cuts = [...new Set([a0, a1, ...holes.flatMap(o => [o.a, o.b])])].filter(v => v >= a0 && v <= a1).sort((p, q) => p - q);
  for (let i = 0; i < cuts.length - 1; i++) {
    const s = cuts[i], e = cuts[i + 1], mid = (s + e) / 2;
    let ys = [[base, base + h]];
    for (const o of holes) if (o.a <= mid && o.b >= mid)
      ys = ys.flatMap(([y0, y1]) => { const r = []; if (o.y0 > y0) r.push([y0, Math.min(y1, o.y0)]); if (o.y1 < y1) r.push([Math.max(y0, o.y1), y1]); return r; });
    for (const [y0, y1] of ys) if (y1 - y0 > .01) {
      if (axis === 'x') addBox(c, mid, t, e - s, y1 - y0, mat, y0); else addBox(mid, c, e - s, t, y1 - y0, mat, y0);
    }
  }
}
const door = (a, b, h = 2.7) => ({ a, b, y0: 0, y1: h });
const win = (a, b, y0 = 1, y1 = 2.2) => ({ a, b, y0, y1 });
// stairs of 10 steps rising 3.2 m over 4.5 m; dir +1 climbs toward +x, -1 toward -x (all run along x)
function stairs(xBottom, dir, z0, z1) {
  for (let k = 0; k < 10; k++) addBox(xBottom + dir * (.45 * k + .225), (z0 + z1) / 2, .45, z1 - z0, (k + 1) * .32, 'concrete');
}
const LAMPS = [], RACKS = [], TRUCKS = [], INDOOR = [], TANKS = [], SIGNS = [];
const FLOORS2 = [];     // walkable second-floor rectangles [x0, z0, x1, z1]
const LINKS = [];       // stair links between floors: [groundX, groundZ, upperX, upperZ]
(function buildMap() {
  // outer perimeter
  addBox(0, -MZ - .5, MX * 2 + 2, 1, 9, 'metalwall'); addBox(0, MZ + .5, MX * 2 + 2, 1, 9, 'metalwall');
  addBox(-MX - .5, 0, 1, MZ * 2, 9, 'metalwall'); addBox(MX + .5, 0, 1, MZ * 2, 9, 'metalwall');

  // Blue base line (x = -38) with one gate to each of A, middle and B
  wall('x', -38, -32, 32, 3.5, 'concrete', [door(20, 24, 9), door(-2, 2, 9), door(-24, -20, 9)], .6);
  // A / middle / B separation walls, each with one gap
  wall('z', 10, -38, -8, 3.5, 'concrete', [door(-26, -20, 9)], .6);
  wall('z', -10, -38, -8, 3.5, 'concrete', [door(-26, -20, 9)], .6);

  // ---- A site (north-west courtyard): containers, dumpsters, crates
  addBox(-30, 25, 6, 2.5, 2.6, 'contR'); addBox(-30, 25, 6, 2.5, 2.6, 'contB', 2.6);
  addBox(-18, 17, 2.5, 6, 2.6, 'contG'); addBox(-24, 29.5, 6, 2.5, 2.6, 'contB');
  addBox(-12, 28.5, 2.2, 1.3, 1.4, 'dumpster'); addBox(-26, 13.2, 2.2, 1.3, 1.4, 'dumpster');
  addBox(-34, 14, 1.4, 1.4, 1.4, 'crate'); addBox(-14, 21.5, 1.4, 1.4, 1.4, 'crate'); addBox(-14, 21.5, 1.4, 1.4, 1.4, 'crate', 1.4);
  addBox(-22, 21, 1.4, 1.4, 1.4, 'crate'); addBox(-11, 14, 3, .6, 1, 'barrier');
  SIGNS.push(['A', -25, 20.5]);

  // ---- B site (south-west yard): container stacks and crates
  addBox(-30, -18, 6, 2.5, 2.6, 'contB'); addBox(-30, -18, 6, 2.5, 2.6, 'contR', 2.6);
  addBox(-16, -26, 6, 2.5, 2.6, 'contG'); addBox(-22, -14.5, 2.5, 5, 2.6, 'contR');
  addBox(-12, -16, 1.4, 1.4, 1.4, 'crate'); addBox(-35, -28, 1.4, 1.4, 1.4, 'crate'); addBox(-24, -29.5, 1.4, 1.4, 1.4, 'crate');
  addBox(-24, -29.5, 1.4, 1.4, 1.4, 'crate', 1.4); addBox(-33, -12.5, 2.2, 1.3, 1.4, 'dumpster');
  SIGNS.push(['B', -24, -22]);

  // ---- middle yard (between A and B in front of Blue): cover, plus the balcony stairs
  addBox(-20, 0, 1.4, 1.4, 1.4, 'crate'); addBox(-28, 5, 1.4, 1.4, 1.4, 'crate'); addBox(-28, -5, 1.4, 1.4, 1.4, 'crate');
  addBox(-24, -1.5, .6, 3, 1, 'barrier'); addBox(-32, 0, .8, 3, 1.1, 'sandbag');

  // ---- middle building x -6..14, z -8..8: two storeys, doors on every side, windows upstairs
  const H = 6.8;
  wall('x', -6, -8, 8, H, 'brick', [door(-1.5, 1.5), { a: -1, b: 1, y0: FLOOR2, y1: FLOOR2 + 2.4 }, win(-6, -3.5, 4.1, 5.2), win(3.5, 6, 4.1, 5.2)]);
  wall('x', 14, -8, 8, H, 'brick', [door(-1.5, 1.5), win(4, 6), win(-6, -3, 4.1, 5.2), win(3, 6, 4.1, 5.2)]);
  wall('z', 8, -6.25, 14.25, H, 'brick', [door(2, 4.5), win(-4, -1, 4.1, 5.2), win(8, 11, 4.1, 5.2)]);
  wall('z', -8, -6.25, 14.25, H, 'brick', [door(-3, -.5), win(0, 3, 4.1, 5.2), win(10, 12, 4.1, 5.2)]);
  addBox(4, 0, 20.6, 16.6, .3, 'roof', H);
  // second floor slab with a stairwell hole at x 4..8.5, z -7.75..-5.75
  addBox(-.875, 0, 9.75, 15.5, .2, 'slab', FLOOR2 - .2); addBox(6.25, 1, 4.5, 13.5, .2, 'slab', FLOOR2 - .2); addBox(11.125, 0, 5.25, 15.5, .2, 'slab', FLOOR2 - .2);

  for (const f of feed) f.t -= dt;

  drawRadar();

}
function renderBoard() {

    <div><h3 style="color:var(--red)">레드 ${G.score.red}</h3><table><tr><td></td><td>킬</td><td>데스</td></tr>${team('red')}</table></div>`;
}

// =============== input ===============
let locked = false, lockFallback = false;
const playing = () => G.state === 'play';
window.addEventListener('keydown', e => {
  if (G.state !== 'play' && G.state !== 'count') return;
  if (e.code === 'Tab' || e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (!playing() || me.dead) return;
  const sl = slots();
  if (e.code === 'Digit1') selectWeapon(sl[0]);
  if (e.code === 'Digit2') selectWeapon(sl[1]);
  if (e.code === 'Digit3') selectWeapon(sl[2]);
  if (e.code === 'KeyX') selectWeapon(prevWeapon);
  if (settings.leanMode === 'toggle' && (e.code === 'KeyQ' || e.code === 'KeyE')) { const d = e.code === 'KeyQ' ? -1 : 1; leanToggle = leanToggle === d ? 0 : d; }

  if ((e.code === 'KeyC' || e.code === 'ControlLeft') && settings.crouchMode === 'toggle') crouchToggle = !crouchToggle;
  if (e.code === 'KeyG' && nades > 0) { nades--; throwNade(me); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; triggerHeld = false; if (settings.aimMode === 'hold') setAim(false); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (!playing() || me.dead) return;
  const sl = slots(), i = sl.indexOf(weapon); selectWeapon(sl[(i + (e.deltaY > 0 ? 1 : -1) + sl.length) % sl.length]);
}, { passive: true });
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  if (!locked && (G.state === 'play' || G.state === 'count') && !touch && !lockFallback) pauseGame();
});
function look(dx, dy, k) {
  const w = WEAPONS[weapon];
  const zoomK = aiming ? settings.adsSens * (w.scope ? .35 : .7) : 1;
  me.yaw -= dx * k * settings.sens * zoomK;
  me.pitch = Math.max(-1.45, Math.min(1.45, me.pitch - dy * k * settings.sens * zoomK));
}
function aimPress(down) {

  else setAim(down);
}
document.addEventListener('mousemove', e => { if (locked && playing()) look(e.movementX, e.movementY, .0022); });
canvas.addEventListener('mousedown', e => {
  if (!playing()) return;
  if (!locked && !lockFallback) { requestLock(); return; }
  if (e.button === 0) { triggerHeld = true; firedThisPress = false; }
  if (e.button === 2) aimPress(true);
});
window.addEventListener('mouseup', e => { if (e.button === 0) triggerHeld = false; if (e.button === 2) aimPress(false); });
const drags = new Map();
canvas.addEventListener('pointerdown', e => {
  if (!playing() || locked) return;
  if (e.pointerType === 'mouse' && !lockFallback) return;
  drags.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => { const d = drags.get(e.pointerId); if (!d) return; look(e.clientX - d.x, e.clientY - d.y, touch ? .0055 : .0035); d.x = e.clientX; d.y = e.clientY; });
const endDrag = e => drags.delete(e.pointerId);
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
const joyEl = $('joy'), knob = $('knob'); let joyId = null;
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
function joyMove(e) {
  const r = joyEl.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - r.left - R, dy = e.clientY - r.top - R;
  const len = Math.hypot(dx, dy), max = R - 18;
  if (len > max) { dx *= max / len; dy *= max / len; }
  joy.x = dx / max; joy.y = dy / max; knob.style.transform = `translate(${dx}px, ${dy}px)`;
}
for (const id of ['tFire', 'tFire2']) {
  const el = $(id); let pid = null, lx = 0, ly = 0;
  el.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; lx = e.clientX; ly = e.clientY; el.setPointerCapture(pid); triggerHeld = true; firedThisPress = false; el.classList.add('on'); });
  el.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; look(e.clientX - lx, e.clientY - ly, .0055); lx = e.clientX; ly = e.clientY; });
  const up = e => { if (e.pointerId !== pid) return; pid = null; triggerHeld = false; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
const tap = (id, f) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); if (playing() && !me.dead) f(); });
$('tAim').addEventListener('pointerdown', e => { e.preventDefault(); aimPress(true); });
$('tAim').addEventListener('pointerup', () => aimPress(false)); $('tAim').addEventListener('pointercancel', () => aimPress(false));
tap('tReload', startReload);
tap('tSwap', () => { const sl = slots(), i = sl.indexOf(weapon); selectWeapon(sl[(i + 1) % sl.length]); });

$('tCrouch').addEventListener('pointerdown', e => {
  e.preventDefault(); if (!playing() || me.dead) return;
  if (settings.crouchMode === 'toggle') crouchToggle = !crouchToggle; else touchCrouch = true;
});
const crouchUp = () => { touchCrouch = false; };
$('tCrouch').addEventListener('pointerup', crouchUp); $('tCrouch').addEventListener('pointercancel', crouchUp);
$('tJump').addEventListener('pointerdown', e => { e.preventDefault(); jumpHeld = true; });
$('tJump').addEventListener('pointerup', () => { jumpHeld = false; }); $('tJump').addEventListener('pointercancel', () => { jumpHeld = false; });
$('tMenu').addEventListener('click', () => pauseGame());
for (const [id, d] of [['tLeanL', -1], ['tLeanR', 1]]) {
  const el = $(id);
  el.addEventListener('pointerdown', e => {

window.addEventListener('keydown', e => { if (e.code === 'Escape' && lockFallback && G.state === 'play') pauseGame(); });
function requestLock() {
  if (touch || !canvas.requestPointerLock) return;

// =============== menus and match flow ===============
function segHtml(key, opts) {
  return `<div class="seg" style="--n:${opts.length}" role="group">${opts.map(([v, label]) => `<button type="button" data-set="${key}" data-val="${v}" aria-pressed="${settings[key] === v}">${label}</button>`).join('')}</div>`;
}
function settingsHtml(inMatch) {

    <div class="set">
      <span class="lab">주무기${inMatch ? ' (다음 부활부터 적용)' : ''}</span>

      ${inMatch ? '' : `<span class="lab">봇 난이도</span>${segHtml('diff', Object.keys(DIFF).map(k => [k, DIFF[k].n]))}`}
      <span class="lab">조준 방식</span>
      ${segHtml('aimMode', [['hold', '누르고 있기'], ['toggle', '눌러서 켜고 끄기']])}

      <div class="row"><label for="adsSens">조준 감도</label><input id="adsSens" type="range" min="0.2" max="2" step="0.05" value="${settings.adsSens}"><output id="adsSensV">${settings.adsSens.toFixed(2)}</output></div>

function bindSliders() {

}
function controlsHtml() {
  return touch ? `
    <details><summary>조작법</summary><dl class="keys">
      <dt>왼쪽 조이스틱</dt><dd>이동</dd>
      <dt>화면 드래그</dt><dd>조준 방향 돌리기</dd>
      <dt>발사</dt><dd>누르는 동안 쏘기, 누른 채로 끌면 시점도 돌아가요</dd>
      <dt>조준 · 장전 · 무기</dt><dd>정조준, 재장전, 무기 바꾸기</dd>
      <dt>앉기 · 점프 · 수류탄</dt><dd>앉으면 더 정확해져요</dd>
    </dl></details>` : `
    <details><summary>조작법</summary><dl class="keys">

function setupMatch() {
  for (const a of G.actors) if (a.mesh) scene.remove(a.mesh);
  for (const p of G.nades) scene.remove(p.mesh);
  clearPickups();
  G.actors = []; G.nades = []; G.score = { blue: 0, red: 0 }; G.time = 0; feed.length = 0; renderFeed();
  me = newActor('blue', '나', true);
  for (const n of NAMES.blue) newActor('blue', n, false);
  for (const n of NAMES.red) newActor('red', n, false);
  for (const a of G.actors) spawnActor(a);
  $('centerMsg').hidden = true;
}
function startMatch() {
  audioInit();
  setupMatch();
  G.state = 'count'; G.countdown = 3;
  $('overlay').hidden = true; $('hud').hidden = false; $('touch').hidden = !touch;
  requestLock();
}
function pauseGame() {
  if (G.state !== 'play' && G.state !== 'count') return;
  G.resume = G.state; G.state = 'pause';
  triggerHeld = false; for (const k in keys) keys[k] = false;
  if (settings.aimMode === 'hold') setAim(false);
  if (document.pointerLockElement) document.exitPointerLock();
  $('card').innerHTML = `
    <h2>일시정지</h2>
    <p>블루 ${G.score.blue} : ${G.score.red} 레드 · 먼저 ${GOAL}킬을 내는 팀이 이겨요</p>
    ${settingsHtml(true)}
    ${controlsHtml()}
    <button class="btn" type="button" data-act="resume">계속하기</button>
    <button class="btn ghost" type="button" data-act="menu">메인 메뉴로</button>`;
  bindSliders();
  $('overlay').hidden = false;
}
function resumeGame() { $('overlay').hidden = true; G.state = G.resume || 'play'; audioInit(); requestLock(); }
function endMatch() {
  if (G.state === 'over') return;

  if (document.pointerLockElement) document.exitPointerLock();
  const win = G.score.blue > G.score.red ? '승리' : G.score.blue < G.score.red ? '패배' : '무승부';
  const mvp = G.actors.slice().sort((a, b) => b.kills - a.kills || a.deaths - b.deaths)[0];
  setTimeout(() => {
    $('card').innerHTML = `
      <h2>${win}</h2>
      <div class="result"><span class="b">${G.score.blue}</span> : <span class="r">${G.score.red}</span></div>
      <p>내 기록: ${me.kills}킬 ${me.deaths}데스 · MVP ${mvp.name} (${mvp.kills}킬)</p>
      <button class="btn" type="button" data-act="start">다시 하기</button>
      <button class="btn ghost" type="button" data-act="menu">메인 메뉴로</button>`;
    $('overlay').hidden = false;

}
function showMenu() {
  G.state = 'menu';
  $('hud').hidden = true; $('touch').hidden = true;
  $('card').innerHTML = `
    <h1>보급기지 작전<small>TEAM DEATHMATCH 5 VS 5</small></h1>
    <p>창고와 골목이 얽힌 보급기지에서 아군 봇 4명과 함께 레드 팀 봇 5명을 상대해요. 먼저 ${GOAL}킬을 내거나 5분이 끝났을 때 앞선 팀이 이겨요.</p>
    ${settingsHtml(false)}

    <button class="btn" type="button" data-act="start">전투 시작</button>`;
  bindSliders();

$('overlay').addEventListener('click', e => {
  const s = e.target.closest('[data-set]');
  if (s) {
    settings[s.dataset.set] = s.dataset.val; saveSettings();
    s.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === s)));
    if (s.dataset.set === 'quality') applyQuality();
    if (s.dataset.set === 'aimMode') setAim(false);
    if (s.dataset.set === 'crouchMode') { crouchToggle = false; touchCrouch = false; }

  const b = e.target.closest('[data-act]'); if (!b) return;

});

// =============== main loop ===============
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - (last || ts)) / 1000);
  last = ts;
  if (G.state === 'count') {
    G.countdown -= dt;
    showCenter(Math.max(1, Math.ceil(G.countdown)), '전투 준비');
    if (G.countdown <= 0) { G.state = 'play'; $('centerMsg').hidden = true; }
  }
  if (G.state === 'play') step(dt);
  else if (G.state === 'over') { for (const a of G.actors) if (!a.isMe) updateBot(a, 0); }
  render(dt);
  requestAnimationFrame(frame);
}
function step(dt) {
  G.time += dt;
  if (G.time >= MATCH_TIME) endMatch();
  for (const a of G.actors) {
    a.spotted = Math.max(0, a.spotted - dt);
    if (a.dead) {
      a.respawn -= dt;
      if (a.respawn <= 0) { spawnActor(a); if (a.isMe) $('centerMsg').hidden = true; }
      else if (a.isMe) showCenter('사망', `${me.lastHitBy && me.lastHitBy !== me ? me.lastHitBy.name + '에게 당했어요 · ' : ''}${Math.ceil(a.respawn)}초 후 부활`);
    }
  }
  updatePlayer(dt);
  for (const a of G.actors) if (!a.isMe) updateBot(a, dt);
  updateNades(dt);
  updatePickups(dt);
}
function render(dt) {
  if (G.state !== 'menu') {
    if (G.state !== 'pause') updateFx(dt);
    const dead = me.dead;
    const [lx, lz] = dead ? [0, 0] : leanVec(me);
    camera.position.set(me.x + lx, me.y + (dead ? .4 : eyeH(me)) + (dead ? 0 : Math.sin(bob * 2) * .022), me.z + lz);
    camera.rotation.set(me.pitch + recoilP * .3, me.yaw, dead ? .6 : -(me.leanOff || 0) / LEAN_DIST * LEAN_ROLL);
    const w = WEAPONS[weapon];
    const targetFov = aiming && !w.melee ? w.fov : 75;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 14);
    camera.updateProjectionMatrix();
    vm.kick = Math.max(0, (vm.kick || 0) - dt * 10);
    vm.knifeT = Math.max(0, (vm.knifeT || 0) - dt);
    vm.boltT = Math.max(0, (vm.boltT || 0) - dt);
    vm.flashT = (vm.flashT || 0) - dt; if (vm.flashT <= 0) vm.flash.visible = false;
    const ads = aiming && !w.scope && !w.melee;
    const sw = switchT > 0 ? switchT / .35 : 0, rl = reloadT > 0 ? Math.sin(Math.min(1, 1 - reloadT / w.reload) * Math.PI) : 0;
    const mv = Math.min(1, Math.hypot(me.vx, me.vz) / 5);
    const bx = Math.cos(bob) * .012 * mv, by = Math.abs(Math.sin(bob)) * .012 * mv;
    vm.root.visible = !dead && !(aiming && w.scope);
    // aiming slides the weapon so its sight sits at the screen center
    const tx = ads ? 0 : .17 + bx, ty = ads ? w.adsY : -.19 - by, tz = ads ? w.adsZ : -.4;
    vm.ax = vm.ax === undefined ? tx : vm.ax + (tx - vm.ax) * Math.min(1, dt * 18);
    vm.ay = vm.ay === undefined ? ty : vm.ay + (ty - vm.ay) * Math.min(1, dt * 18);
    vm.az = vm.az === undefined ? tz : vm.az + (tz - vm.az) * Math.min(1, dt * 18);
    vm.root.position.set(vm.ax, vm.ay - sw * .3 - rl * .12, vm.az + vm.kick * (ads ? .02 : .05));
    const bolt = vm.boltT > 0 ? Math.sin(vm.boltT / .9 * Math.PI) : 0;
    vm.root.rotation.set(vm.kick * (ads ? .02 : .08) + rl * .6 + bolt * .25 - (vm.knifeT > 0 ? Math.sin(vm.knifeT / .25 * Math.PI) * .9 : 0), 0, rl * .3 + bolt * .2);
    vm.flash.position.set(0, .01, weapon === 'pistol' ? -.16 : weapon === 'sniper' ? -.85 : -.72);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(vmScene, vmCamera);
    if (me) hud(dt);
  } else {
    const t = performance.now() / 1000 * .12;
    camera.position.set(28 + Math.sin(t) * .5, 2.1, 18.8);
    camera.rotation.set(-.05, Math.PI / 2 + Math.sin(t * .6) * .25, 0);
    camera.fov = 65; camera.updateProjectionMatrix();
    renderer.clear(); renderer.render(scene, camera);
  }
}

// =============== boot ===============
function boot() {
  if (!window.THREE) { $('card').innerHTML = `<h2>불러오지 못했어요</h2><p class="err">3D 엔진(three.js)을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>`; return; }
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl') || probe.getContext('experimental-webgl'))) {
    $('card').innerHTML = `<h2>3D를 켤 수 없어요</h2><p class="err">이 기기나 브라우저에서 WebGL을 쓸 수 없어요. 다른 브라우저에서 열어 보세요.</p>`; return;
  }
  try { initThree(); } catch (e) {
    $('card').innerHTML = `<h2>불러오는 중 문제가 생겼어요</h2><p class="err">${String(e && e.message || e)}</p>`; console.error(e); return;
  }
  if (touch) document.body.classList.add('ptr');
  setupMatch();
  showMenu();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
boot();
</script>
