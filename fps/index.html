<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jammini_FPS_1.0</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen first-person view; HUD on the edges: score+timer top center, radar top-left,
   killfeed top-right, health bottom-left, ammo bottom-right, touch controls over the lower half. Single military look. */
:root {
  --ink: #eef0ea;
  --muted: #a9aea4;
  --hud: rgba(14, 16, 14, .6);
  --hud-solid: #141713;
  --line: rgba(238, 240, 234, .18);
  --blue: #5b95f0;
  --red: #ef5a4f;
  --amber: #f2b13a;
  --ok: #9ad46f;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #22261f; color: var(--ink); }
body { font: 14px/1.45 var(--font-body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.42) 100%); }
.hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }

.cross { position: fixed; left: 50%; top: 50%; width: 0; height: 0; }
.cross i { position: absolute; background: var(--ok); box-shadow: 0 0 0 1px rgba(0,0,0,.55); }
.cross .t, .cross .b { width: 2px; height: 8px; left: -1px; }
.cross .l, .cross .r { height: 2px; width: 8px; top: -1px; }
.cross .dot { width: 2px; height: 2px; left: -1px; top: -1px; }
.reddot { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #ff2a2a; box-shadow: 0 0 6px 2px rgba(255, 40, 40, .7), 0 0 0 1px rgba(0,0,0,.4); }
.hitm { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; }
.hitm::before, .hitm::after { content: ""; position: absolute; left: 10px; top: -3px; width: 2px; height: 28px; background: #fff; transform: rotate(45deg); }
.hitm::after { transform: rotate(-45deg); }
.hitm.kill::before, .hitm.kill::after { background: var(--red); }
.dmgdir { position: fixed; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border-top: 6px solid rgba(239, 90, 79, .85); opacity: 0; }
.scope { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0 34vmin, rgba(0,0,0,.35) 34.2vmin, #000 35vmin); }
.scope::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.9); }
.scope::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(0,0,0,.9); }
.hurt { position: fixed; inset: 0; box-shadow: inset 0 0 140px 40px rgba(190, 20, 20, .55); opacity: 0; }

.score { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; align-items: stretch; border-radius: 8px; overflow: hidden; background: var(--hud); }
.score div { padding: 4px 14px; font: 700 22px/1.2 var(--font-num); }
.score .sb { background: rgba(91, 149, 240, .32); }
.score .sr { background: rgba(239, 90, 79, .32); }
.score .st { font-size: 15px; display: grid; place-items: center; min-width: 64px; color: var(--muted); }
.zonetag { position: fixed; left: 10px; top: calc(140px + env(safe-area-inset-top, 0px)); width: 124px; text-align: center; padding: 2px 4px; border-radius: 6px; background: var(--hud); font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptr .zonetag { top: calc(112px + env(safe-area-inset-top, 0px)); width: 96px; }
.radar { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); width: 124px; height: 124px; border-radius: 50%; background: rgba(14, 16, 14, .55); border: 1px solid var(--line); }
.feed { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 3px; max-width: 46vw; }
.feed div { padding: 2px 8px; border-radius: 5px; background: var(--hud); font-size: 12.5px; white-space: nowrap; }
.feed .b { color: var(--blue); font-weight: 700; } .feed .r { color: var(--red); font-weight: 700; }
.feed .w { color: var(--muted); padding-inline: 6px; } .feed .hs { color: var(--amber); font-weight: 700; }
.feed .me { outline: 1px solid var(--amber); }
.chat { position: fixed; left: 10px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 3px; pointer-events: none; z-index: 6; }
.chat .log { display: flex; flex-direction: column; gap: 2px; }
.chat .log div { align-self: flex-start; max-width: 100%; padding: 2px 8px; border-radius: 5px; background: rgba(0,0,0,.45); font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; transition: opacity .6s; }
.chat .log b { margin-right: 6px; } .chat .log .mine b { color: var(--amber); } .chat .log .sys { color: var(--muted); }
.chat input { pointer-events: auto; font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--amber); background: rgba(10,12,10,.85); color: #fff; outline: none; }
.keyguide { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; width: min(620px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; padding: 16px 18px; border-radius: 12px; background: rgba(12,14,12,.94); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.keyguide h3 { margin: 0 0 10px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.keyguide h3 small { font-size: 12px; color: var(--muted); font-weight: 400; }
.keyguide .kg { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 18px; }
.keyguide .kg div { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.keyguide kbd { display: inline-block; min-width: 30px; padding: 3px 7px; border-radius: 6px; background: #2b302a; border: 1px solid #4a5048; border-bottom-width: 3px; font: 700 12px var(--font-num); text-align: center; color: #fff; white-space: nowrap; }
.keyguide .kk { display: flex; gap: 4px; min-width: 112px; justify-content: flex-end; }
.killcam { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
.killcam .kcbar { position: absolute; left: 0; right: 0; height: 9vh; background: #000; }
.killcam .kcbar.top { top: 0; } .killcam .kcbar.bot { bottom: 0; }
.killcam .kctag { position: absolute; left: 4vw; top: calc(9vh + 18px); font: 800 clamp(22px, 4vw, 40px)/1 var(--font-num); letter-spacing: .18em; color: var(--amber); text-shadow: 0 2px 10px rgba(0,0,0,.7); animation: banSub .5s ease-out both; }
.killcam .kcwho { position: absolute; left: 4vw; top: calc(9vh + 18px + clamp(30px, 5vw, 50px)); font-size: clamp(15px, 2vw, 20px); text-shadow: 0 2px 6px #000; }
.killcam .kcwho .b { color: var(--blue); font-weight: 700; } .killcam .kcwho .r { color: var(--red); font-weight: 700; } .killcam .kcwho .hs { color: var(--amber); font-weight: 700; }
.killcam::after { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .25s; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.6) 100%); }
.killcam.bullet::after { opacity: 1; }
.killcam .kcskip { position: absolute; right: 4vw; bottom: calc(9vh + 14px); font-size: 12px; color: var(--muted); }
.grps { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.grpbtn { display: flex; align-items: center; gap: 10px; text-align: left; padding-inline: 14px; }
.grpbtn span { font-weight: 700; } .grpbtn small { flex: 1; color: var(--muted); font-weight: 400; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .grpbtn i { font-style: normal; color: var(--muted); }
.grp { padding: 4px 2px 8px; }
.mapdesc { margin: 0; font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; }
.lchat { margin: 8px 0; text-align: left; }
.lchat .log { max-height: 130px; overflow-y: auto; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.3); font-size: 13px; line-height: 1.4; min-height: 40px; }
.lchat .log b { margin-right: 6px; } .lchat .log .mine b { color: var(--amber); } .lchat .log .sys { color: var(--muted); }
.lchat input { width: 100%; box-sizing: border-box; margin-top: 6px; font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: inherit; }
.hp { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 8px; background: var(--hud); display: flex; align-items: center; gap: 10px; }
.hp b { font: 700 30px/1 var(--font-num); min-width: 2.2em; }
.hp .bar { width: 120px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
.hp .bar i { display: block; height: 100%; width: 100%; background: var(--ok); }
.ammo { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 8px; background: var(--hud); text-align: right; }
.ammo b { font: 700 30px/1 var(--font-num); }
.ammo span { font: 500 15px var(--font-num); color: var(--muted); }
.ammo small { display: block; font-size: 12px; color: var(--muted); }
.center-msg { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); text-align: center; text-shadow: 0 2px 6px #000; }
.center-msg b { display: block; font: 700 46px/1 var(--font-num); letter-spacing: .04em; }
.center-msg span { font-size: 15px; }
.pickmsg { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 4px 12px; border-radius: 8px; background: var(--hud); font-weight: 700; font-size: 13px; color: var(--ok); white-space: nowrap; }
.reloadmsg { position: fixed; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-weight: 700; font-size: 13px; color: var(--amber); text-shadow: 0 1px 3px #000; }

.board { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); padding: 12px; border-radius: 12px; background: rgba(14, 16, 14, .9); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.board h3 { margin: 0 0 6px; font: 700 17px var(--font-body); }
.board table { width: 100%; border-collapse: collapse; font-size: 13px; }
.board td { padding: 3px 4px; border-top: 1px solid var(--line); }
.board td:not(:first-child) { text-align: right; font-family: var(--font-num); }
.board .meRow { color: var(--amber); font-weight: 700; }

.touch { position: fixed; inset: 0; pointer-events: none; }
.touch > * { pointer-events: auto; }
.joy { position: fixed; left: 22px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px; border-radius: 50%; background: rgba(14,16,14,.3); border: 2px solid var(--line); touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(238,240,234,.5); }
.tb { position: fixed; border: 2px solid var(--line); border-radius: 50%; background: rgba(14,16,14,.45); font-weight: 700; font-size: 12px; display: grid; place-items: center; touch-action: none; }
.tb.on { background: rgba(242, 177, 58, .7); color: #111; }
.tb.fire { width: 84px; height: 84px; right: 26px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); background: rgba(239, 90, 79, .55); font-size: 15px; }
.tb.fire2 { width: 64px; height: 64px; left: 26px; bottom: calc(220px + env(safe-area-inset-bottom, 0px)); background: rgba(239, 90, 79, .45); }
.tb.aim { width: 56px; height: 56px; right: 122px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.tb.jump { width: 56px; height: 56px; right: 30px; bottom: calc(216px + env(safe-area-inset-bottom, 0px)); }
.tb.crouch { width: 50px; height: 50px; right: 96px; bottom: calc(232px + env(safe-area-inset-bottom, 0px)); }
.tb.reload { width: 50px; height: 50px; right: 44px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
.tb.swap { width: 50px; height: 50px; right: 180px; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
.tb.leanl { width: 50px; height: 40px; left: 170px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); border-radius: 10px; font-size: 11px; }
.tb.leanr { width: 50px; height: 40px; left: 226px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); border-radius: 10px; font-size: 11px; }
.tb.nade { width: 50px; height: 50px; right: 168px; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
.tb.menu { width: 44px; height: 44px; left: 50%; margin-left: -22px; top: calc(52px + env(safe-area-inset-top, 0px)); border-radius: 10px; }
.ptr .hp, .ptr .ammo { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.ptr .ammo { right: 50%; transform: translateX(calc(50% + 90px)); }
.ptr .hp { left: 50%; transform: translateX(calc(-50% - 90px)); }
.ptr .radar { width: 96px; height: 96px; }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(8, 10, 8, .6); }
.card { width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; padding: 20px 18px; border-radius: 14px; background: var(--hud-solid); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; text-align: center; }
.card h1 { margin: 0; font: 700 36px/1.1 var(--font-body); color: var(--amber); letter-spacing: -.01em; text-wrap: balance; }
.card h1 small { display: block; font: 700 13px var(--font-num); color: var(--muted); letter-spacing: .25em; margin-top: 6px; }
.card h2 { margin: 0; font: 700 28px var(--font-body); }
.card p { margin: 0; color: var(--muted); }
.set { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.set .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }
.seg button { height: 38px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--amber); color: #111; border-color: var(--amber); }
.row { display: flex; align-items: center; gap: 10px; }
.row label { flex: none; width: 5.5em; font-weight: 700; font-size: 13px; }
.row input { flex: 1; min-width: 0; accent-color: var(--amber); }
.row output { width: 2.6em; text-align: right; font-family: var(--font-num); }
.keys { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; font-size: 12.5px; }
.keys dt { font-family: var(--font-num); font-weight: 700; white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
details { text-align: left; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
.btn { height: 50px; border: 0; border-radius: 10px; background: var(--amber); color: #111; font: 700 20px var(--font-body); box-shadow: 0 4px 0 #8f5e05; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8f5e05; }
.btn.ghost { background: #2b3029; color: var(--ink); box-shadow: 0 4px 0 #0c0e0c; font-size: 15px; }
.result { font: 700 42px/1 var(--font-num); }
.result .b { color: var(--blue); } .result .r { color: var(--red); }
.err { color: #ffb4a8; }
/* match end: slow motion banner and color grade */
.endban { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: grid; place-items: center; align-content: center; gap: 6px; }
.endban::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 150px; margin-top: -84px; background: linear-gradient(90deg, transparent, rgba(8,10,8,.78) 18%, rgba(8,10,8,.78) 82%, transparent); transform: scaleX(0); animation: banBar .5s .05s cubic-bezier(.2,.8,.2,1) forwards; }
.endban b { position: relative; font: 700 clamp(64px, 15vw, 132px)/1 var(--font-body); letter-spacing: .08em; opacity: 0; animation: banIn .7s .15s cubic-bezier(.15,1.4,.35,1) forwards; }
.endban span { position: relative; font: 700 clamp(14px, 2.6vw, 22px) var(--font-num); letter-spacing: .6em; padding-left: .6em; color: var(--ink); opacity: 0; animation: banSub .6s .55s ease-out forwards; }
.endban.win b { color: var(--amber); text-shadow: 0 0 28px rgba(242,177,58,.75), 0 4px 0 #6d4704; }
.endban.lose b { color: var(--red); text-shadow: 0 0 28px rgba(239,90,79,.6), 0 4px 0 #5a1611; }
.endban.draw b { color: var(--ink); text-shadow: 0 0 24px rgba(255,255,255,.4), 0 4px 0 #333; }
@keyframes banIn { 0% { opacity: 0; transform: scale(2.6); filter: blur(10px); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: scale(1); } }
@keyframes banSub { from { opacity: 0; letter-spacing: 1.4em; } to { opacity: .9; letter-spacing: .6em; } }
@keyframes banBar { to { transform: scaleX(1); } }
#view { transition: filter 1.4s ease-out; }
body.end-win #view { filter: saturate(1.3) sepia(.22) brightness(1.06) contrast(1.05); }
body.end-lose #view { filter: grayscale(.85) brightness(.82) contrast(1.1); }
body.end-draw #view { filter: saturate(.6) brightness(.95); }
body.ending .hud > :not(.score) { opacity: 0 !important; }
.card > * { flex-shrink: 0; }
.netcode { font: 700 54px/1 var(--font-num); letter-spacing: .25em; padding-left: .25em; color: var(--amber); }
.netcode small { display: block; font: 700 12px var(--font-body); letter-spacing: .1em; color: var(--muted); margin-top: 4px; }
.card input:not([type]) { flex: 1; min-width: 0; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: #10130f; color: var(--ink); padding: 0 10px; font: 700 16px var(--font-body); }
.btn:disabled { opacity: .45; cursor: default; }
.card.wide { max-width: 760px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats div { padding: 8px 4px; border-radius: 8px; background: #1d211b; border: 1px solid var(--line); }
.stats b { display: block; font: 700 22px/1.1 var(--font-num); }
.stats small { font-size: 11.5px; color: var(--muted); }
.card .board { position: static; transform: none; width: 100%; padding: 0; background: none; text-align: left; }
.mvp { color: var(--amber); font-weight: 700; }
/* loadout screen */
.lo-sec { text-align: left; display: flex; flex-direction: column; gap: 6px; }
.lo-sec h3 { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
.lo-grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
.lo { position: relative; padding: 8px 9px 9px; border-radius: 10px; border: 1px solid var(--line); background: #1b1f19; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.lo[aria-pressed="true"] { border-color: var(--amber); background: #2c2817; box-shadow: inset 0 0 0 1px var(--amber); }
.lo .k { position: absolute; right: 8px; top: 6px; font: 700 11px var(--font-num); color: var(--muted); }
.lo b { font-size: 15px; }
.lo .d { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.lo svg { width: 100%; height: 34px; }
.lo .bars { display: grid; grid-template-columns: auto 1fr; gap: 2px 6px; align-items: center; font-size: 10.5px; color: var(--muted); }
.lo .bars i { display: block; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.lo .bars i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--amber); }
.lo-note { font-size: 12px; color: var(--muted); }
@media (max-width: 620px) { .lo-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-height: 520px) { .card details { display: none; } .lo .d, .lo svg { display: none; } }
@media (max-height: 720px) {
  .overlay { padding: 8px; }
  .card > p:not(.keep) { display: none; }
  .lo .bars { display: none; }
  .card { gap: 8px; padding-block: 12px; }
  .card h1 { font-size: 24px; } .card h1 small { margin-top: 2px; }
  .set { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; row-gap: 6px; }
  .set .row { grid-column: 1 / -1; }
  .seg button { height: 32px; }
  .btn { height: 44px; }
}
@media (max-width: 480px) { .score div { font-size: 18px; padding: 3px 10px; } .hp .bar { width: 70px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="view" aria-label="게임 화면"></canvas>

// ---- host side: follow the friend's messages and send snapshots
function netRemote(a, dt) {

function netShot(shooter, end) { if (NET.shots.length < 24) NET.shots.push([G.actors.indexOf(shooter), +end[0].toFixed(2), +end[1].toFixed(2), +end[2].toFixed(2)]); }
const R2 = v => Math.round(v * 100) / 100;
function netHostTick(dt) {

    a: G.actors.map(a => [R2(a.x), R2(a.y), R2(a.z), R2(a.yaw), R2(a.pitch), a.crouch ? 1 : 0, R2(a.leanOff || 0), Math.ceil(a.hp), a.dead ? 1 : 0, a.kills, a.deaths, R2(Math.max(0, a.respawn || 0)), a.protect > 0 ? 1 : 0, R2(a.spotted || 0), (a.isMe ? aiming : a.aiming) ? 1 : 0, (a.isMe ? me.sprint : a.sprintF) ? 1 : 0]),

// ---- client side: send my state, mirror the host
function netApplySnap(m) {

function netClientStep(dt) {
  if (G.state === 'play') updatePlayer(dt);

    a.spotted = Math.max(0, (a.spotted || 0) - dt);
    if (a.isMe) continue;

      const px = a.x, pz = a.z, s = netSample(a);

      else { const k = Math.min(1, dt * 14); a.x += (r[0] - a.x) * k; a.y += (r[1] - a.y) * k; a.z += (r[2] - a.z) * k; a.yaw += wrap(r[3] - a.yaw) * k; }

// ping every 2 s, and whether the browsers talk directly or through PeerJS's relay server (shown top-left in matches)
function netPingTick(dt) {

// small line under the score: frames per second (setting) and, online, ping and connection type
const perfInfo = { t: 0, n: 0, fps: 0 };

  const online = NET.role !== 'off', showFps = settings.showFps === 'on';

// an invite link: opening it switches to the host's map (and depot yard) and joins the room straight away
function netInviteLink() {

function netCopyInvite() {

// =============== main loop ===============
let last = 0;
function frame(ts) {
  const rawDt = (ts - (last || ts)) / 1000;
  last = ts;

function step(dt) {

      else if (a.isMe) showCenter('사망', `${me.lastHitBy && me.lastHitBy !== me ? me.lastHitBy.name + '에게 당했어요 · ' : ''}${Math.ceil(a.respawn)}초 후 부활`);

let shadowT = 1;

    camera.position.set(me.x + lx, me.y + (dead ? .4 : (me.eyeS = me.eyeS === undefined ? eyeH(me) : me.eyeS + (eyeH(me) - me.eyeS) * Math.min(1, dt * 9))) + (dead ? 0 : Math.sin(bob * 2) * .022), me.z + lz);
    vm.slideK = (vm.slideK || 0) + ((slideT > 0 ? 1 : 0) - (vm.slideK || 0)) * Math.min(1, dt * 10);

// =============== boot ===============
function boot() {

  }

  }

  netAutoJoin();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
boot();
