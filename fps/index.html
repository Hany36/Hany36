<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>컨테이너 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen first-person view; HUD on the edges: score+timer top center, radar top-left,
   killfeed top-right, health bottom-left, ammo bottom-right, touch controls over the lower half. Single dusk look. */
:root {
  --ink: #f3f1ea;
  --muted: #b9b6aa;
  --hud: rgba(12, 14, 12, .62);
  --hud-solid: #151814;
  --line: rgba(243, 241, 234, .2);
  --blue: #4f8df0;
  --red: #ef4f4f;
  --amber: #ffb02e;
  --ok: #8fd16a;
  --font-display: "Black Ops One", "Impact", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #2a2f2a; color: var(--ink); }
body { font: 14px/1.45 var(--font-body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }

/* crosshair */
.cross { position: fixed; left: 50%; top: 50%; width: 0; height: 0; }
.cross i { position: absolute; background: var(--ok); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.cross .t, .cross .b { width: 2px; height: 8px; left: -1px; }
.cross .l, .cross .r { height: 2px; width: 8px; top: -1px; }
.cross .dot { width: 2px; height: 2px; left: -1px; top: -1px; }
.hitm { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; }
.hitm::before, .hitm::after { content: ""; position: absolute; left: 10px; top: -3px; width: 2px; height: 28px; background: #fff; transform: rotate(45deg); }
.hitm::after { transform: rotate(-45deg); }
.hitm.kill::before, .hitm.kill::after { background: var(--red); }
.dmgdir { position: fixed; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border-top: 6px solid rgba(239, 79, 79, .85); opacity: 0; }
.scope { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0 34vmin, #000 34.4vmin); }
.scope::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000; }
.scope::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #000; }
.hurt { position: fixed; inset: 0; box-shadow: inset 0 0 120px 40px rgba(200, 20, 20, .55); opacity: 0; }

.score { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; align-items: stretch; border-radius: 10px; overflow: hidden; background: var(--hud); }
.score div { padding: 4px 14px; font: 700 22px/1.2 var(--font-num); }
.score .sb { background: rgba(79, 141, 240, .35); }
.score .sr { background: rgba(239, 79, 79, .35); }
.score .st { font-size: 15px; display: grid; place-items: center; min-width: 64px; color: var(--muted); }
.radar { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); width: 124px; height: 124px; border-radius: 50%; background: rgba(12, 14, 12, .55); border: 1px solid var(--line); }
.feed { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 3px; max-width: 46vw; }
.feed div { padding: 2px 8px; border-radius: 6px; background: var(--hud); font-size: 12.5px; white-space: nowrap; }
.feed .b { color: var(--blue); font-weight: 700; } .feed .r { color: var(--red); font-weight: 700; }
.feed .w { color: var(--muted); padding-inline: 6px; } .feed .hs { color: var(--amber); font-weight: 700; }
.feed .me { outline: 1px solid var(--amber); }
.hp { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 10px; background: var(--hud); display: flex; align-items: center; gap: 10px; }
.hp b { font: 700 30px/1 var(--font-num); min-width: 2.2em; }
.hp .bar { width: 120px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
.hp .bar i { display: block; height: 100%; width: 100%; background: var(--ok); }
.ammo { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 10px; background: var(--hud); text-align: right; }
.ammo b { font: 700 30px/1 var(--font-num); }
.ammo span { font: 500 15px var(--font-num); color: var(--muted); }
.ammo small { display: block; font-size: 12px; color: var(--muted); }
.center-msg { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); text-align: center; text-shadow: 0 2px 6px #000; }
.center-msg b { display: block; font: 400 44px/1 var(--font-display); letter-spacing: .04em; }
.center-msg span { font-size: 15px; }
.reload { position: fixed; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-weight: 700; font-size: 13px; color: var(--amber); text-shadow: 0 1px 3px #000; }

/* scoreboard */
.board { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); padding: 12px; border-radius: 14px; background: rgba(12, 14, 12, .88); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.board h3 { margin: 0 0 6px; font: 400 18px var(--font-display); letter-spacing: .05em; }
.board table { width: 100%; border-collapse: collapse; font-size: 13px; }
.board td { padding: 3px 4px; border-top: 1px solid var(--line); }
.board td:not(:first-child) { text-align: right; font-family: var(--font-num); }
.board .meRow { color: var(--amber); font-weight: 700; }

/* touch controls */
.touch { position: fixed; inset: 0; pointer-events: none; }
.touch > * { pointer-events: auto; }
.joy { position: fixed; left: 22px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px; border-radius: 50%; background: rgba(12,14,12,.3); border: 2px solid var(--line); touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(243,241,234,.5); }
.tb { position: fixed; border: 2px solid var(--line); border-radius: 50%; background: rgba(12,14,12,.45); font-weight: 700; font-size: 12px; display: grid; place-items: center; touch-action: none; }
.tb.on { background: rgba(255, 176, 46, .65); color: #111; }
.tb.fire { width: 84px; height: 84px; right: 26px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); background: rgba(239, 79, 79, .55); font-size: 15px; }
.tb.fire2 { width: 64px; height: 64px; left: 26px; bottom: calc(220px + env(safe-area-inset-bottom, 0px)); background: rgba(239, 79, 79, .45); }
.tb.aim { width: 56px; height: 56px; right: 122px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.tb.jump { width: 56px; height: 56px; right: 30px; bottom: calc(216px + env(safe-area-inset-bottom, 0px)); }
.tb.crouch { width: 50px; height: 50px; right: 96px; bottom: calc(232px + env(safe-area-inset-bottom, 0px)); }
.tb.reload { width: 50px; height: 50px; right: 44px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
.tb.swap { width: 50px; height: 50px; right: 180px; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
.tb.nade { width: 50px; height: 50px; right: 168px; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
.tb.menu { width: 44px; height: 44px; left: 50%; margin-left: -22px; top: calc(52px + env(safe-area-inset-top, 0px)); border-radius: 12px; }
.ptr .hp, .ptr .ammo { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.ptr .ammo { right: 50%; transform: translateX(calc(50% + 90px)); }
.ptr .hp { left: 50%; transform: translateX(calc(-50% - 90px)); }
.ptr .radar { width: 96px; height: 96px; }

/* menus */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(8, 10, 8, .62); }
.card { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; padding: 22px 18px; border-radius: 16px; background: var(--hud-solid); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; text-align: center; }
.card h1 { margin: 0; font: 400 40px/1.05 var(--font-display); color: var(--amber); letter-spacing: .04em; text-wrap: balance; }
.card h1 small { display: block; font: 700 14px var(--font-body); color: var(--muted); letter-spacing: .3em; margin-top: 6px; }
.card h2 { margin: 0; font: 400 30px var(--font-display); letter-spacing: .04em; }
.card p { margin: 0; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { height: 40px; border: 1px solid var(--line); border-radius: 10px; background: transparent; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--amber); color: #111; border-color: var(--amber); }
.row { display: flex; align-items: center; gap: 10px; text-align: left; }
.row label { flex: none; font-weight: 700; font-size: 13px; }
.row input { flex: 1; min-width: 0; accent-color: var(--amber); }
.keys { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; font-size: 12.5px; }
.keys dt { font-family: var(--font-num); font-weight: 700; white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
.btn { height: 50px; border: 0; border-radius: 12px; background: var(--amber); color: #111; font: 400 22px var(--font-display); letter-spacing: .06em; box-shadow: 0 4px 0 #9a6200; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9a6200; }
.btn.ghost { background: #2c322b; color: var(--ink); box-shadow: 0 4px 0 #0c0e0c; font: 700 15px var(--font-body); }
.result { font: 700 42px/1 var(--font-num); }
.result .b { color: var(--blue); } .result .r { color: var(--red); }
.err { color: #ffb4a8; }
@media (max-height: 520px) { .card .keys { display: none; } .card { gap: 10px; padding-block: 16px; } .card h1 { font-size: 30px; } }
@media (max-width: 480px) { .card h1 { font-size: 32px; } .score div { font-size: 18px; padding: 3px 10px; } .hp .bar { width: 70px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="view" aria-label="게임 화면"></canvas>

<div class="hud" id="hud" hidden>
  <div class="scope" id="scope" hidden></div>
  <div class="hurt" id="hurt"></div>
  <div class="cross" id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div class="hitm" id="hitm"></div>
  <div class="dmgdir" id="dmgdir"></div>
  <div class="score"><div class="sb" id="sBlue">0</div><div class="st" id="sTime">5:00</div><div class="sr" id="sRed">0</div></div>
  <canvas class="radar" id="radar" width="248" height="248"></canvas>
  <div class="feed" id="feed"></div>
  <div class="hp"><b id="hpNum">100</b><div class="bar"><i id="hpBar"></i></div></div>
  <div class="ammo"><b id="ammoMag">30</b> <span id="ammoRes">/ 120</span><small id="wName">소총 · 수류탄 2</small></div>
  <div class="reload" id="reloadMsg" hidden>재장전 중</div>
  <div class="center-msg" id="centerMsg" hidden><b id="cmBig"></b><span id="cmSmall"></span></div>
  <div class="board" id="board" hidden></div>
</div>

<div class="touch" id="touch" hidden>
  <div class="joy" id="joy"><i id="knob"></i></div>
  <button class="tb fire" id="tFire" type="button">발사</button>
  <button class="tb fire2" id="tFire2" type="button">발사</button>
  <button class="tb aim" id="tAim" type="button">조준</button>
  <button class="tb jump" id="tJump" type="button">점프</button>
  <button class="tb crouch" id="tCrouch" type="button">앉기</button>
  <button class="tb reload" id="tReload" type="button">장전</button>
  <button class="tb swap" id="tSwap" type="button">무기</button>
  <button class="tb nade" id="tNade" type="button">수류탄</button>
  <button class="tb menu" id="tMenu" type="button">II</button>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"><p>불러오는 중…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// =============== map ===============
const MX = 45, MZ = 30;                     // half extents (meters)
const BOXES = [];
function addBox(cx, cz, sx, sz, h, mat, y0 = 0) {
  BOXES.push({ x0: cx - sx / 2, x1: cx + sx / 2, z0: cz - sz / 2, z1: cz + sz / 2, y0, y1: y0 + h, mat });
}
// Every piece on the blue half is mirrored (rotated 180°) onto the red half, so both teams get the same map.
function addPair(cx, cz, sx, sz, h, mat, y0 = 0) { addBox(cx, cz, sx, sz, h, mat, y0); addBox(-cx, -cz, sx, sz, h, mat, y0); }
(function buildMap() {
  addBox(0, -MZ - .5, MX * 2 + 2, 1, 6, 'wall'); addBox(0, MZ + .5, MX * 2 + 2, 1, 6, 'wall');
  addBox(-MX - .5, 0, 1, MZ * 2, 6, 'wall'); addBox(MX + .5, 0, 1, MZ * 2, 6, 'wall');
  addBox(0, 0, 3, 3, 2.4, 'concrete');
  // spawn cover
  addPair(-34, -7, 1, 6, 1.3, 'concrete'); addPair(-34, 7, 1, 6, 1.3, 'concrete');
  // container rows split the yard into north, middle and south lanes
  addPair(-27, 13, 12, 2.6, 2.6, 'contB'); addPair(-24, 13, 6, 2.6, 2.6, 'contO', 2.6);
  addPair(-11, 13, 7, 2.6, 2.6, 'contY');
  addPair(-28, -13, 9, 2.6, 2.6, 'contR'); addPair(-14, -13, 9, 2.6, 2.6, 'contG');
  addPair(-5, 13, 2.6, 2.6, 2.6, 'contR');
  // north warehouse with two doorways
  addPair(-21, 25, .4, 10, 4, 'brick');
  addPair(-18.5, 20, 5, .4, 4, 'brick');
  addPair(-12.5, 20, 3, .4, 4, 'brick');
  addPair(-11, 27, .4, 6, 4, 'brick');
  addPair(-16, 29.2, 10, 1.6, 4, 'brick');
  // cover
  addPair(-7, 3, 1.2, 1.2, 1.2, 'crate'); addPair(-7, 4.2, 1.2, 1.2, 1.2, 'crate'); addPair(-7, 3.6, 1.2, 1.2, 1.2, 'crate', 1.2);
  addPair(-20, 0, 1.2, 1.2, 1.2, 'crate'); addPair(-20, 0, 1.2, 1.2, 1.2, 'crate', 1.2); addPair(-21.2, 0, 1.2, 1.2, 1.2, 'crate');
  addPair(-14, 6, 1.2, 1.2, 1.2, 'crate'); addPair(-25, -5, 1.2, 1.2, 1.2, 'crate');
  addPair(-10, -6, 1.2, 1.2, 1.2, 'crate'); addPair(-16, -3, .6, 4, 1.1, 'concrete');
  addPair(-26, -22, 1.2, 1.2, 1.2, 'crate'); addPair(-18, -24, 4, .6, 1.1, 'concrete');
  addPair(-8, -21, 1.2, 1.2, 1.2, 'crate'); addPair(-8, -22.2, 1.2, 1.2, 1.2, 'crate');
  addPair(-31, -25, 1.2, 1.2, 1.2, 'crate'); addPair(-30, 22, 1.2, 1.2, 1.2, 'crate');
  addPair(-4, 24, 1.2, 1.2, 1.2, 'crate'); addPair(-3, 26.5, 2, .6, 1.1, 'concrete');
})();

// =============== navigation grid (1 m cells) ===============
const GW = MX * 2, GH = MZ * 2;
const walk = new Uint8Array(GW * GH);
const cellOf = (x, z) => [Math.floor(x + MX), Math.floor(z + MZ)];
const cellCenter = (i, j) => [i - MX + .5, j - MZ + .5];
(function buildNav() {
  const R = .45;
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const [x, z] = cellCenter(i, j);
    let ok = true;
    for (const b of BOXES) if (b.y0 < 1.8 && x + R > b.x0 && x - R < b.x1 && z + R > b.z0 && z - R < b.z1) { ok = false; break; }
    walk[j * GW + i] = ok ? 1 : 0;
  }
})();
const walkable = (i, j) => i >= 0 && j >= 0 && i < GW && j < GH && walk[j * GW + i] === 1;
function gridLine(a, b) {   // straight walkable line between two cells
  let [x0, y0] = a; const [x1, y1] = b;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  for (;;) {
    if (!walkable(x0, y0)) return false;
    if (x0 === x1 && y0 === y1) return true;
    const e2 = 2 * err;
    if (e2 > -dy && e2 < dx) { if (!walkable(x0 + sx, y0) || !walkable(x0, y0 + sy)) return false; }
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
}
function nearestWalk(i, j) {
  if (walkable(i, j)) return [i, j];
  for (let r = 1; r < 8; r++) for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) if (walkable(i + di, j + dj)) return [i + di, j + dj];
  return [i, j];
}
function findPath(sx, sz, tx, tz) {
  const s = nearestWalk(...cellOf(sx, sz)), t = nearestWalk(...cellOf(tx, tz));
  const N = GW * GH, start = s[1] * GW + s[0], goal = t[1] * GW + t[0];
  const g = new Float32Array(N).fill(Infinity), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const heap = [];
  const push = (n, f) => { heap.push([f, n]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top[1]; };
  const hf = n => { const dx = Math.abs(n % GW - t[0]), dz = Math.abs(((n / GW) | 0) - t[1]); return Math.max(dx, dz) + .414 * Math.min(dx, dz); };
  g[start] = 0; push(start, hf(start));
  let found = false;
  while (heap.length) {
    const n = pop();
    if (closed[n]) continue;
    if (n === goal) { found = true; break; }
    closed[n] = 1;
    const ni = n % GW, nj = (n / GW) | 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const ai = ni + di, aj = nj + dj;
      if (!walkable(ai, aj)) continue;
      if (di && dj && (!walkable(ni + di, nj) || !walkable(ni, nj + dj))) continue;
      const m = aj * GW + ai, cost = g[n] + (di && dj ? 1.414 : 1);
      if (cost < g[m]) { g[m] = cost; from[m] = n; push(m, cost + hf(m)); }
    }
  }
  if (!found) return [];
  const cells = [];
  for (let n = goal; n !== -1; n = from[n]) cells.push([n % GW, (n / GW) | 0]);
  cells.reverse();
  const out = []; let anchor = 0;   // string-pull: keep only the corners we need
  for (let k = 2; k < cells.length; k++) if (!gridLine(cells[anchor], cells[k])) { out.push(cells[k - 1]); anchor = k - 1; }
  out.push(cells[cells.length - 1]);
  return out.map(c => cellCenter(c[0], c[1]));
}
const POIS = [];
for (const z of [-24, -18, 0, 6, 18, 25]) for (const x of [-30, -20, -10, 0, 10, 20, 30]) {
  const c = cellOf(x, z); if (walkable(...c)) POIS.push([x, z]);
}

// =============== ray tests ===============
function rayBox(o, d, b, maxT) {
  let t0 = 0, t1 = maxT, n = 0;
  const lo = [b.x0, b.y0, b.z0], hi = [b.x1, b.y1, b.z1];
  for (let a = 0; a < 3; a++) {
    if (Math.abs(d[a]) < 1e-9) { if (o[a] < lo[a] || o[a] > hi[a]) return null; continue; }
    let ta = (lo[a] - o[a]) / d[a], tb = (hi[a] - o[a]) / d[a], na = -(a + 1);
    if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; na = a + 1; }
    if (ta > t0) { t0 = ta; n = na; }
    if (tb < t1) t1 = tb;
    if (t0 > t1) return null;
  }
  return { t: t0, n };
}
function rayMap(o, d, maxT) {
  let best = null;
  // the ground plane
  if (d[1] < 0) { const t = -o[1] / d[1]; if (t > 0 && t < maxT) best = { t, n: 2 }; }

function showCenter(big, small) { $('cmBig').textContent = big; $('cmSmall').textContent = small; $('centerMsg').hidden = false; }
const radarCtx = $('radar').getContext('2d');
function drawRadar() {
  const c = radarCtx, W = 248, R = 124, scale = 3.2;
  c.clearRect(0, 0, W, W);
  c.save(); c.translate(R, R);
  c.beginPath(); c.arc(0, 0, R - 2, 0, Math.PI * 2); c.clip();
  c.rotate(me.yaw);
  c.fillStyle = 'rgba(243,241,234,.18)';
  for (const b of BOXES) {
    if (b.mat === 'wall' || b.y0 > 0) continue;
    c.fillRect((b.x0 - me.x) * scale, (b.z0 - me.z) * scale, (b.x1 - b.x0) * scale, (b.z1 - b.z0) * scale);
  }
  c.strokeStyle = 'rgba(243,241,234,.45)'; c.lineWidth = 2;
  c.strokeRect((-MX - me.x) * scale, (-MZ - me.z) * scale, MX * 2 * scale, MZ * 2 * scale);
  for (const a of G.actors) {
    if (a.isMe || a.dead) continue;
    if (a.team === 'red' && a.spotted <= 0) continue;
    c.fillStyle = a.team === 'blue' ? '#4f8df0' : '#ef4f4f';
    c.beginPath(); c.arc((a.x - me.x) * scale, (a.z - me.z) * scale, 6, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  c.fillStyle = '#ffb02e';
  c.beginPath(); c.moveTo(R, R - 10); c.lineTo(R - 7, R + 8); c.lineTo(R + 7, R + 8); c.closePath(); c.fill();
}
function hud(dt) {
  $('sBlue').textContent = G.score.blue; $('sRed').textContent = G.score.red;
  const left = Math.max(0, Math.ceil(MATCH_TIME - G.time));
  $('sTime').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  $('hpNum').textContent = Math.ceil(me.hp);
  $('hpBar').style.width = `${me.hp}%`;
  $('hpBar').style.background = me.hp > 50 ? 'var(--ok)' : me.hp > 25 ? 'var(--amber)' : 'var(--red)';
  const w = WEAPONS[weapon], a = ammo[weapon];
  $('ammoMag').textContent = w.melee ? '-' : a.mag;
  $('ammoRes').textContent = w.melee ? '' : `/ ${a.res}`;
  $('wName').textContent = `${w.n} · 수류탄 ${nades}`;
  $('reloadMsg').hidden = !(reloadT > 0);
  const scoped = aiming && w.scope && !me.dead;
  $('scope').hidden = !scoped;
  $('cross').style.visibility = scoped || (aiming && !w.melee) ? 'hidden' : 'visible';
  const gap = 5 + currentSpread() * 260;
  const cr = $('cross').children;
  cr[0].style.top = `${-gap - 8}px`; cr[1].style.top = `${gap}px`; cr[2].style.left = `${-gap - 8}px`; cr[3].style.left = `${gap}px`;
  hitT = Math.max(0, hitT - dt); $('hitm').style.opacity = hitT > 0 ? 1 : 0;
  hurtT = Math.max(0, hurtT - dt);
  $('hurt').style.opacity = Math.max(hurtT, me.hp < 30 && !me.dead ? .35 : 0);
  $('dmgdir').style.opacity = hurtT; $('dmgdir').style.transform = `rotate(${-hurtAng}rad)`;
  for (const f of feed) f.t -= dt;
  if (feed.length && feed[feed.length - 1].t <= 0) { feed.pop(); renderFeed(); }
  drawRadar();
  $('board').hidden = !(keys.Tab || G.state === 'over');
  if (!$('board').hidden) renderBoard();
}
function renderBoard() {
  const team = t => G.actors.filter(a => a.team === t).sort((x, y) => y.kills - x.kills)
    .map(a => `<tr class="${a.isMe ? 'meRow' : ''}"><td>${a.name}</td><td>${a.kills}</td><td>${a.deaths}</td></tr>`).join('');
  $('board').innerHTML = `
    <div><h3 style="color:var(--blue)">블루 ${G.score.blue}</h3><table><tr><td></td><td>킬</td><td>데스</td></tr>${team('blue')}</table></div>
    <div><h3 style="color:var(--red)">레드 ${G.score.red}</h3><table><tr><td></td><td>킬</td><td>데스</td></tr>${team('red')}</table></div>`;
}

// =============== input ===============
const touch = matchMedia('(pointer: coarse)').matches;
let locked = false, lockFallback = false, touchCrouch = false;
window.addEventListener('keydown', e => {
  if (G.state !== 'play' && G.state !== 'count') return;
  if (e.code === 'Tab') e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (G.state !== 'play' || me.dead) return;
  if (e.code === 'Digit1') selectWeapon('rifle');
  if (e.code === 'Digit2') selectWeapon('pistol');
  if (e.code === 'Digit3') selectWeapon('sniper');
  if (e.code === 'Digit4') selectWeapon('knife');
  if (e.code === 'KeyQ') selectWeapon(prevWeapon);
  if (e.code === 'KeyR') startReload();
  if (e.code === 'KeyG' && nades > 0) { nades--; throwNade(me); }
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; triggerHeld = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (G.state !== 'play' || me.dead) return;
  const i = SLOTS.indexOf(weapon); selectWeapon(SLOTS[(i + (e.deltaY > 0 ? 1 : -1) + SLOTS.length) % SLOTS.length]);
}, { passive: true });
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  if (!locked && (G.state === 'play' || G.state === 'count') && !touch && !lockFallback) pauseGame();
});
function look(dx, dy, k) {
  const zoomK = aiming ? (WEAPONS[weapon].scope ? .3 : .7) : 1;
  me.yaw -= dx * k * settings.sens * zoomK;
  me.pitch = Math.max(-1.45, Math.min(1.45, me.pitch - dy * k * settings.sens * zoomK));
}
document.addEventListener('mousemove', e => { if (locked && G.state === 'play') look(e.movementX, e.movementY, .0022); });
canvas.addEventListener('mousedown', e => {
  if (G.state !== 'play') return;
  if (!locked && !lockFallback) { requestLock(); return; }
  if (e.button === 0) { triggerHeld = true; firedThisPress = false; }
  if (e.button === 2 && !me.dead && !WEAPONS[weapon].melee && reloadT <= 0) aiming = !aiming;
});
window.addEventListener('mouseup', e => { if (e.button === 0) triggerHeld = false; });
// drag-to-look fallback (mouse without pointer lock, and touch on the right side)
const drags = new Map();
canvas.addEventListener('pointerdown', e => {
  if (G.state !== 'play' || locked) return;
  if (e.pointerType === 'mouse' && !lockFallback) return;
  drags.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => { const d = drags.get(e.pointerId); if (!d) return; look(e.clientX - d.x, e.clientY - d.y, touch ? .0055 : .0035); d.x = e.clientX; d.y = e.clientY; });
const endDrag = e => drags.delete(e.pointerId);
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
// touch buttons
const joyEl = $('joy'), knob = $('knob'); let joyId = null;
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
function joyMove(e) {
  const r = joyEl.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - r.left - R, dy = e.clientY - r.top - R;
  const len = Math.hypot(dx, dy), max = R - 18;
  if (len > max) { dx *= max / len; dy *= max / len; }
  joy.x = dx / max; joy.y = dy / max; knob.style.transform = `translate(${dx}px, ${dy}px)`;
}
// the fire buttons also turn the view while held, like most mobile shooters
for (const id of ['tFire', 'tFire2']) {
  const el = $(id); let pid = null, lx = 0, ly = 0;
  el.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; lx = e.clientX; ly = e.clientY; el.setPointerCapture(pid); triggerHeld = true; firedThisPress = false; el.classList.add('on'); });
  el.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; look(e.clientX - lx, e.clientY - ly, .0055); lx = e.clientX; ly = e.clientY; });
  const up = e => { if (e.pointerId !== pid) return; pid = null; triggerHeld = false; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
const tap = (id, f) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); if (G.state === 'play' && !me.dead) f(); });
tap('tAim', () => { if (!WEAPONS[weapon].melee && reloadT <= 0) aiming = !aiming; $('tAim').classList.toggle('on', aiming); });
tap('tReload', startReload);
tap('tSwap', () => { const i = SLOTS.indexOf(weapon); selectWeapon(SLOTS[(i + 1) % SLOTS.length]); $('tAim').classList.remove('on'); });
tap('tNade', () => { if (nades > 0) { nades--; throwNade(me); } });
tap('tCrouch', () => { touchCrouch = !touchCrouch; $('tCrouch').classList.toggle('on', touchCrouch); });
$('tJump').addEventListener('pointerdown', e => { e.preventDefault(); jumpHeld = true; });
$('tJump').addEventListener('pointerup', () => { jumpHeld = false; }); $('tJump').addEventListener('pointercancel', () => { jumpHeld = false; });
$('tMenu').addEventListener('click', () => pauseGame());
window.addEventListener('keydown', e => { if (e.code === 'Escape' && lockFallback && G.state === 'play') pauseGame(); });
function requestLock() {
  if (touch || !canvas.requestPointerLock) return;
  try {
    const r = canvas.requestPointerLock();
    if (r && r.catch) r.catch(() => { lockFallback = true; });
  } catch (e) { lockFallback = true; }
  setTimeout(() => { if (!locked && G.state === 'play') lockFallback = true; }, 700);
}

// =============== match flow ===============
function setupMatch() {
  for (const a of G.actors) if (a.mesh) scene.remove(a.mesh);
  for (const p of G.nades) scene.remove(p.mesh);
  G.actors = []; G.nades = []; G.score = { blue: 0, red: 0 }; G.time = 0; feed.length = 0; renderFeed();
  me = newActor('blue', '나', true);
  for (const n of NAMES.blue) newActor('blue', n, false);
  for (const n of NAMES.red) newActor('red', n, false);
  for (const a of G.actors) spawnActor(a);
  $('centerMsg').hidden = true;
}
function startMatch() {
  audioInit();
  setupMatch();
  G.state = 'count'; G.countdown = 3;
  $('overlay').hidden = true; $('hud').hidden = false; $('touch').hidden = !touch;
  requestLock();
}
function pauseGame() {
  if (G.state !== 'play' && G.state !== 'count') return;
  G.resume = G.state; G.state = 'pause';
  triggerHeld = false; for (const k in keys) keys[k] = false;
  if (document.pointerLockElement) document.exitPointerLock();
  $('card').innerHTML = `
    <h2>일시정지</h2>
    <p>블루 ${G.score.blue} : ${G.score.red} 레드 · 먼저 ${GOAL}킬을 내는 팀이 이겨요</p>
    ${controlsHtml()}
    <button class="btn" type="button" data-act="resume">계속하기</button>
    <button class="btn ghost" type="button" data-act="menu">메인 메뉴로</button>`;
  $('overlay').hidden = false;
}
function resumeGame() { $('overlay').hidden = true; G.state = G.resume || 'play'; audioInit(); requestLock(); }
function endMatch() {
  if (G.state === 'over') return;
  G.state = 'over'; triggerHeld = false; aiming = false;
  if (document.pointerLockElement) document.exitPointerLock();
  const win = G.score.blue > G.score.red ? '승리' : G.score.blue < G.score.red ? '패배' : '무승부';
  const mvp = G.actors.slice().sort((a, b) => b.kills - a.kills || a.deaths - b.deaths)[0];
  setTimeout(() => {
    $('card').innerHTML = `
      <h2>${win}</h2>
      <div class="result"><span class="b">${G.score.blue}</span> : <span class="r">${G.score.red}</span></div>
      <p>내 기록: ${me.kills}킬 ${me.deaths}데스 · MVP ${mvp.name} (${mvp.kills}킬)</p>
      <button class="btn" type="button" data-act="start">다시 하기</button>
      <button class="btn ghost" type="button" data-act="menu">메인 메뉴로</button>`;
    $('overlay').hidden = false;
  }, 1200);
}
function controlsHtml() {
  return touch ? `
    <dl class="keys">
      <dt>왼쪽 조이스틱</dt><dd>이동</dd>
      <dt>화면 드래그</dt><dd>조준 방향 돌리기</dd>
      <dt>발사</dt><dd>누르는 동안 쏘기, 누른 채로 끌면 시점도 돌아가요</dd>
      <dt>조준 · 장전 · 무기</dt><dd>정조준, 재장전, 무기 바꾸기</dd>
      <dt>앉기 · 점프 · 수류탄</dt><dd>앉으면 더 정확해져요</dd>
    </dl>` : `
    <dl class="keys">
      <dt>W A S D</dt><dd>이동 (Shift 걷기)</dd>
      <dt>마우스</dt><dd>조준</dd>
      <dt>왼쪽 클릭</dt><dd>발사</dd>
      <dt>오른쪽 클릭</dt><dd>정조준 / 저격 스코프</dd>
      <dt>R</dt><dd>재장전</dd>
      <dt>1 2 3 4 · Q · 휠</dt><dd>소총, 권총, 저격총, 칼 · 이전 무기</dd>
      <dt>G</dt><dd>수류탄</dd>
      <dt>Space · Ctrl/C</dt><dd>점프 · 앉기</dd>
      <dt>Tab</dt><dd>점수판</dd>
      <dt>Esc</dt><dd>일시정지</dd>
    </dl>`;
}
function showMenu() {
  G.state = 'menu';
  $('hud').hidden = true; $('touch').hidden = true;
  const seg = Object.keys(DIFF).map(k => `<button type="button" data-diff="${k}" aria-pressed="${settings.diff === k}">${DIFF[k].n}</button>`).join('');
  $('card').innerHTML = `
    <h1>컨테이너 작전<small>팀 데스매치 5 대 5</small></h1>
    <p>아군 봇 4명과 함께 레드 팀 봇 5명을 상대해요. 먼저 ${GOAL}킬을 내거나 5분이 끝났을 때 앞선 팀이 이겨요.</p>
    <div class="seg" role="group" aria-label="봇 난이도">${seg}</div>
    <div class="row"><label for="sens">감도</label><input id="sens" type="range" min="0.3" max="2.5" step="0.1" value="${settings.sens}"><span id="sensV">${settings.sens.toFixed(1)}</span></div>
    ${controlsHtml()}
    <button class="btn" type="button" data-act="start">전투 시작</button>`;
  $('overlay').hidden = false;
  $('sens').addEventListener('input', e => { settings.sens = +e.target.value; $('sensV').textContent = settings.sens.toFixed(1); saveSettings(); });
}
function saveSettings() { try { localStorage.setItem('container-op.settings', JSON.stringify(settings)); } catch (e) { /* storage unavailable */ } }
$('overlay').addEventListener('click', e => {
  const d = e.target.closest('[data-diff]');
  if (d) { settings.diff = d.dataset.diff; saveSettings(); document.querySelectorAll('[data-diff]').forEach(b => b.setAttribute('aria-pressed', String(b === d))); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'start') startMatch();
  if (b.dataset.act === 'resume') resumeGame();
  if (b.dataset.act === 'menu') { if (document.pointerLockElement) document.exitPointerLock(); showMenu(); }
});

// =============== main loop ===============
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - (last || ts)) / 1000);
  last = ts;
  if (G.state === 'count') {
    G.countdown -= dt;
    showCenter(Math.max(1, Math.ceil(G.countdown)), '전투 준비');
    if (G.countdown <= 0) { G.state = 'play'; $('centerMsg').hidden = true; }
  }
  if (G.state === 'play') step(dt);
  else if (G.state === 'over') { for (const a of G.actors) if (!a.isMe) updateBot(a, 0); }
  render(dt);
  requestAnimationFrame(frame);
}
function step(dt) {
  G.time += dt;
  if (G.time >= MATCH_TIME) endMatch();
  for (const a of G.actors) {
    a.spotted = Math.max(0, a.spotted - dt);
    if (a.dead) {
      a.respawn -= dt;
      if (a.respawn <= 0) { spawnActor(a); if (a.isMe) $('centerMsg').hidden = true; }
      else if (a.isMe) showCenter('사망', `${me.lastHitBy && me.lastHitBy !== me ? me.lastHitBy.name + '에게 당했어요 · ' : ''}${Math.ceil(a.respawn)}초 후 부활`);
    }
  }
  updatePlayer(dt);
  for (const a of G.actors) if (!a.isMe) updateBot(a, dt);
  updateNades(dt);
}
function render(dt) {
  if (G.state === 'play' || G.state === 'count' || G.state === 'over' || G.state === 'pause') {
    if (G.state !== 'pause') updateFx(dt);
    const dead = me.dead;
    camera.position.set(me.x, me.y + (dead ? .4 : eyeH(me)) + (dead ? 0 : Math.sin(bob * 2) * .025), me.z);
    camera.rotation.set(me.pitch + recoilP * .3, me.yaw, dead ? .6 : 0);
    const w = WEAPONS[weapon];
    const targetFov = aiming && !w.melee ? w.fov : 75;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 14);
    camera.updateProjectionMatrix();
    // view model pose
    vm.kick = Math.max(0, (vm.kick || 0) - dt * 10);
    vm.knifeT = Math.max(0, (vm.knifeT || 0) - dt);
    vm.flashT = (vm.flashT || 0) - dt; if (vm.flashT <= 0) vm.flash.visible = false;
    const ads = aiming && !w.scope;
    const sw = switchT > 0 ? switchT / .35 : 0, rl = reloadT > 0 ? Math.sin(Math.min(1, 1 - reloadT / w.reload) * Math.PI) : 0;
    const bx = Math.cos(bob) * .012, by = Math.abs(Math.sin(bob)) * .012;
    vm.root.visible = !dead && !(aiming && w.scope);
    vm.root.position.set(ads ? 0 : .2 + bx, (ads ? -.13 : -.2) - by - sw * .3 - rl * .12, (ads ? -.32 : -.42) + vm.kick * .05);
    vm.root.rotation.set(vm.kick * .08 + rl * .6 - (vm.knifeT > 0 ? Math.sin(vm.knifeT / .25 * Math.PI) * .9 : 0), 0, rl * .3);
    vm.flash.position.set(0, .02, weapon === 'pistol' ? -.18 : weapon === 'sniper' ? -.8 : -.55);
    vmCamera.fov = 60;
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(vmScene, vmCamera);
    if (me) hud(dt);
  } else {
    // menu: slow fly-over of the map
    const t = performance.now() / 1000 * .06;
    camera.position.set(Math.cos(t) * 30, 18, Math.sin(t) * 20);
    camera.lookAt(0, 0, 0);
    camera.fov = 60; camera.updateProjectionMatrix();
    renderer.clear(); renderer.render(scene, camera);
  }
}

// =============== boot ===============
function boot() {
  if (!window.THREE) { $('card').innerHTML = `<h2>불러오지 못했어요</h2><p class="err">3D 엔진(three.js)을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>`; return; }
  try { initThree(); } catch (e) { $('card').innerHTML = `<h2>3D를 켤 수 없어요</h2><p class="err">이 기기나 브라우저에서 WebGL을 쓸 수 없어요. 다른 브라우저에서 열어 보세요.</p>`; return; }
  if (touch) document.body.classList.add('ptr');
  setupMatch();
  showMenu();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
boot();
</script>
</body>
</html>
