<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효과음 테스트 · Jammini_FPS_1.0</title>
<style>
  :root { --bg: #111410; --card: #1b1f19; --line: #2e342b; --ink: #e8eadf; --muted: #9aa190; --amber: #f0b13a; --red: #e0574a; --ok: #7fc06a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 26px 0 8px; color: var(--amber); }
  p.lead { color: var(--muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  button { font: inherit; color: var(--ink); background: #2a3126; border: 1px solid #3b4436; border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #343d2f; }
  button.big { background: var(--amber); color: #1a1505; border: 0; font-weight: 700; padding: 10px 18px; }
  .row { display: grid; grid-template-columns: 34px 150px 1fr 180px 64px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .name b { display: block; }
  .name small, .file { color: var(--muted); font-size: 12px; word-break: break-all; }
  .note { grid-column: 2 / -1; color: #ffcf8a; font-size: 12.5px; margin-top: -4px; }
  .note.info { color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--amber); }
  .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
  select { font: inherit; color: var(--ink); background: #22281f; border: 1px solid #3b4436; border-radius: 6px; padding: 4px 6px; max-width: 100%; }
  .cats .row { grid-template-columns: 190px 1fr 64px; }
  .tests { display: flex; flex-wrap: wrap; gap: 8px; }
  .meter { display: flex; gap: 12px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .bar { flex: 1; height: 10px; background: #22281f; border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .05s; }
  .warn { color: var(--red); }
  textarea { width: 100%; min-height: 120px; background: #0d100c; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.4 ui-monospace, monospace; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: #3a2b14; color: #ffcf8a; margin-left: 6px; }
  @media (max-width: 720px) { .row { grid-template-columns: 34px 1fr; } .row > :nth-child(n+3) { grid-column: 2; } .cats .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>효과음 테스트</h1>
  <p class="lead">직접 들어 보고 크기를 맞추는 화면이에요. 바꾼 값은 이 컴퓨터(이 브라우저/PC 버전)에 바로 저장되고, 게임을 새로고침(F5)하면 게임에도 적용돼요.
    체감 크기는 파일 분석으로 맞춘 출발점일 뿐이라, 최종 판단은 귀로 해 주세요.</p>
  <div class="card">
    <button class="big" id="on">소리 켜기 (먼저 한 번 눌러 주세요)</button>
    <span id="status" style="margin-left:10px;color:var(--muted)"></span>
    <div class="meter">출력 레벨 <div class="bar"><i id="lv"></i></div> <span id="peak">최고 - dBFS</span> <button id="peakReset">최고값 지우기</button></div>
  </div>

  <h2>비교 · 연사 테스트</h2>
  <div class="card tests">
    <button data-test="guns">총성 6종 비교 (0.9초 간격)</button>
    <button data-test="steps">발소리 3종 비교 (바닥별, 0.55초 간격 × 2번)</button>
    <button data-test="stepFiles">발소리 후보 파일 3개 비교</button>
    <button data-test="powerFiles">저격총/리볼버 후보 파일 2개 비교</button>
    <button data-test="rifleAuto">소총 연사 2초</button>
    <button data-test="smgAuto">기관단총 연사 2초</button>
    <button data-test="gunHit">총성 + 히트마커 (소총)</button>
    <button data-test="shotgunHit">총성 + 히트마커 (산탄총)</button>
    <button data-test="knife2">칼 두 번 휘두르기 (트랙 A → B)</button>
  </div>

  <h2>카테고리 볼륨</h2>
  <div class="card cats" id="cats"></div>

  <h2>효과음 14종</h2>
  <div class="card" id="list"></div>

  <h2>저장 · 공유</h2>
  <div class="card">
    <p style="margin:0 0 8px;color:var(--muted)">값은 바꿀 때마다 자동 저장돼요. 아래 '설정 복사'를 눌러 나온 내용을 채팅에 붙여 주시면 게임 기본값으로 넣어 드릴게요.</p>
    <button id="copy">설정 복사</button> <button id="reset">처음 값으로 되돌리기</button>
    <textarea id="json" readonly style="margin-top:10px" hidden></textarea>
  </div>
</main>
<script src="audio.js"></script>
<script>
const $ = id => document.getElementById(id), C = SND.CONFIG;
const LABEL = {
  rifle_shot: ['소총 발사', '총성'], smg_shot: ['기관단총 발사', '총성'], shotgun_shot: ['산탄총 발사', '총성'], pistol_shot: ['권총 발사', '총성'],
  sniper_shot: ['저격총 발사', '총성'], revolver_shot: ['리볼버 발사', '총성'], knife_swing: ['칼 휘두르기', '전투'], bullet_whiz: ['총탄 스침', '전투'],
  grenade_explosion: ['수류탄 폭발', '전투'], character_hit: ['피격음', '전투'], hitmarker: ['히트마커 (명중 확인)', '히트마커'],
  step_sand: ['발소리 · 모래', '발소리'], step_concrete: ['발소리 · 콘크리트', '발소리'], step_container: ['발소리 · 컨테이너 지붕', '발소리'],
};
const CATS = [['masterVolume', '전체 (master)'], ['gunshotsVolume', '총성'], ['footstepsVolume', '발소리'], ['combatEffectsVolume', '전투 효과음 (칼·스침·폭발·피격)'], ['hitmarkerVolume', '히트마커']];
const clipFile = ck => C.clips[ck].file;
const pct = v => Math.round(v * 100) + '%', dbs = v => (v > 0 ? (20 * Math.log10(v)).toFixed(1) : '-∞') + ' dB';
let ctx = null, out = null, an = null, peakDb = -120;

function sliderRow(label, value, max, oninput) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<div>${label}</div><input type="range" min="0" max="${max}" step="0.01" value="${value}"><div class="val"></div>`;
  const r = row.querySelector('input'), v = row.querySelector('.val');
  const show = () => { v.textContent = pct(+r.value); v.title = dbs(+r.value); };
  r.oninput = () => { oninput(+r.value); show(); SND.save(); }; show();
  return row;
}
function buildCats() {
  const el = $('cats'); el.innerHTML = '';
  for (const [k, l] of CATS) el.appendChild(sliderRow(l, C[k], 2, v => SND.setVolume(k, v)));
}
function buildList() {
  const el = $('list'); el.innerHTML = '';
  for (const key in C.sounds) {
    const s = C.sounds[key], [label, cat] = LABEL[key] || [key, ''];
    const row = document.createElement('div'); row.className = 'row';
    const unset = !s.use.length;
    row.innerHTML = `<button title="재생">▶</button><div class="name"><b>${label}${unset ? '<span class="tag">확인 필요</span>' : ''}</b><small>${key} · ${cat}</small></div>
      <div class="file"></div><input type="range" min="0" max="3" step="0.01" value="${s.gain}"><div class="val"></div>`;
    const fileEl = row.querySelector('.file');
    if (s.candidates) {
      const sel = document.createElement('select');
      sel.innerHTML = `<option value="">(고르지 않음 — 예전 합성음)</option>` + s.candidates.map((ck, i) => `<option value="${ck}">${i + 1}. ${clipFile(ck)}</option>`).join('');
      sel.value = s.use[0] || '';
      sel.onchange = () => { s.use = sel.value ? [sel.value] : []; SND.save(); buildList(); };
      fileEl.appendChild(sel);
      // each candidate on its own, numbered like the list
      const cb = document.createElement('div'); cb.style.margin = '4px 0';
      s.candidates.forEach((ck, i) => { const bt = document.createElement('button'); bt.textContent = `▶ ${i + 1}`; bt.style.marginRight = '6px'; bt.title = C.clips[ck].note || clipFile(ck);
        bt.onclick = () => { if (!ctx) { $('status').textContent = '먼저 "소리 켜기"를 눌러 주세요.'; return; } SND.playClip(ck, s.cat, { vol: s.gain }); }; cb.appendChild(bt); });
      fileEl.appendChild(cb);
      const note = document.createElement('div'); note.textContent = s.use.length ? (C.clips[s.use[0]].note || '') : '번호 버튼으로 후보를 하나씩 들어 보고, 맞는 파일을 위에서 고르세요.'; fileEl.appendChild(note);
    } else {
      fileEl.innerHTML = s.use.map(ck => `${clipFile(ck)} <span style="opacity:.7">[${C.clips[ck].clip[0]}–${C.clips[ck].clip[1]}초${s.use.length > 1 ? ', 트랙 ' + ck.slice(-1) : ''}]</span>`).join('<br>');
    }
    const r = row.querySelector('input'), v = row.querySelector('.val');
    const show = () => { v.textContent = pct(+r.value); v.title = dbs(+r.value); };
    r.oninput = () => { s.gain = +r.value; show(); SND.save(); }; show();
    row.querySelector('button').onclick = () => play(key);
    el.appendChild(row);
    const notes = [];
    if (s.check) notes.push(['', s.check]);
    for (const ck of s.use) if (C.clips[ck].note && !s.candidates) notes.push(['info', C.clips[ck].note]);
    for (const [cls, t] of notes) { const n = document.createElement('div'); n.className = 'row'; n.style.borderTop = '0'; n.innerHTML = `<div></div><div class="note ${cls}">${t}</div>`; el.appendChild(n); }
  }
}
function play(key, opts) {
  if (!ctx) { $('status').textContent = '먼저 "소리 켜기"를 눌러 주세요.'; return; }
  if (!SND.play(key, opts)) $('status').textContent = `${(LABEL[key] || [key])[0]}: 파일이 지정되지 않았거나 불러오지 못했어요.`;
}
const at = (sec, fn) => setTimeout(fn, sec * 1000);
const TESTS = {
  guns: () => ['rifle_shot', 'smg_shot', 'shotgun_shot', 'pistol_shot', 'sniper_shot', 'revolver_shot'].forEach((k, i) => at(i * .9, () => play(k))),
  steps: () => [0, 1].forEach(r => ['step_sand', 'step_concrete', 'step_container'].forEach((k, i) => at((r * 3 + i) * .55, () => play(k)))),
  stepFiles: () => ['stepA', 'stepB', 'stepC'].forEach((ck, i) => at(i * .7, () => SND.playClip(ck, 'footsteps'))),
  powerFiles: () => ['pw1', 'pw2'].forEach((ck, i) => at(i * 1.3, () => SND.playClip(ck, 'gunshots'))),
  rifleAuto: () => { for (let t = 0; t < 2; t += .095) at(t, () => play('rifle_shot', { group: 'me', duck: .45 })); },
  smgAuto: () => { for (let t = 0; t < 2; t += .066) at(t, () => play('smg_shot', { group: 'me', duck: .45 })); },
  gunHit: () => { play('rifle_shot'); at(.03, () => play('hitmarker')); },
  shotgunHit: () => { play('shotgun_shot'); at(.03, () => play('hitmarker')); },
  knife2: () => { play('knife_swing'); at(.55, () => play('knife_swing')); },
};
document.querySelectorAll('[data-test]').forEach(b => b.onclick = () => { if (!ctx) { $('status').textContent = '먼저 "소리 켜기"를 눌러 주세요.'; return; } TESTS[b.dataset.test](); });
$('on').onclick = async () => {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    out = ctx.createGain(); an = ctx.createAnalyser(); an.fftSize = 2048; out.connect(an); an.connect(ctx.destination);
    $('status').textContent = '불러오는 중…';
    const miss = await SND.attach(ctx, out);
    $('status').innerHTML = miss.length ? `<span class="warn">불러오지 못한 파일 ${miss.length}개: ${miss.join(', ')}</span>` : `파일 ${SND.files.length}개 준비됨`;
    $('on').textContent = '소리 켜짐'; meter();
  } else ctx.resume();
};
function meter() {
  const buf = new Float32Array(an.fftSize);
  const tick = () => {
    an.getFloatTimeDomainData(buf); let m = 0; for (const x of buf) m = Math.max(m, Math.abs(x));
    const d = 20 * Math.log10(m + 1e-9); peakDb = Math.max(peakDb, d);
    $('lv').style.width = Math.max(0, Math.min(100, (d + 48) / 48 * 100)) + '%'; $('lv').style.background = d > -1 ? 'var(--red)' : d > -6 ? 'var(--amber)' : 'var(--ok)';
    $('peak').textContent = `최고 ${peakDb > -100 ? peakDb.toFixed(1) : '-'} dBFS`; $('peak').className = peakDb > -1 ? 'warn' : '';
    requestAnimationFrame(tick);
  };
  tick();
}
$('peakReset').onclick = () => { peakDb = -120; };
$('copy').onclick = () => {
  const o = SND.save(), txt = JSON.stringify(o, null, 1), ta = $('json');
  ta.hidden = false; ta.value = txt; ta.select();
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { $('copy').textContent = '복사됨 ✓'; setTimeout(() => $('copy').textContent = '설정 복사', 1500); }, () => {});
};
$('reset').onclick = () => { if (!confirm('볼륨과 파일 선택을 처음 값으로 되돌릴까요?')) return; SND.reset(); buildCats(); buildList(); };
buildCats(); buildList();
</script>
</body>
</html>
